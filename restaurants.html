<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>رستورانت‌ها | بازارچه</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;
  --border:rgba(212,175,55,0.22);
  --danger:#e74c3c;--success:#2ecc71;--live:#ff2d55;
  --whatsapp:#25D366;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:280px;height:280px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:240px;height:240px;background:radial-gradient(circle,rgba(26,90,150,0.65),transparent 70%);bottom:-80px;left:-80px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}

.page{position:relative;z-index:2;min-height:100vh}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.92));backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,175,55,0.15);padding:12px 16px}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);transition:all .2s;flex-shrink:0;position:relative}
.icon-btn:active{transform:scale(0.92);background:var(--gold-soft)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cart-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--danger);color:#fff;
  font-size:10px;font-weight:800;border-radius:9px;
  display:none;align-items:center;justify-content:center;
  border:2px solid var(--navy);
}
.cart-badge.show{display:flex;animation:pop 0.3s}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.page-title{flex:1;font-size:16px;font-weight:800;text-align:center;color:var(--gold)}

.search-wrap{position:relative}
.search-wrap input{width:100%;height:46px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0 44px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-wrap .si{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.search-wrap .mic{position:absolute;top:50%;left:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}

.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;max-width:520px;margin:0 auto}
.section-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title .accent{display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.section-count{font-size:11.5px;color:var(--text-dim)}

.wrap{padding:0 16px 30px;max-width:520px;margin:0 auto}
.restaurants{display:flex;flex-direction:column;gap:14px;padding:0 0 8px}

.rest-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;transition:transform .2s;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.rest-card:active{transform:scale(0.99)}

.rest-cover{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.rest-cover svg.cover-icon{width:60px;height:60px;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4}
.rest-badges{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
html[dir="ltr"] .rest-badges{left:auto;right:12px}
.rest-badge{padding:5px 10px;border-radius:8px;font-size:10px;font-weight:800;backdrop-filter:blur(8px);display:flex;align-items:center;gap:4px}
.badge-free{background:var(--gold);color:var(--navy)}
.badge-open{background:rgba(46,204,113,0.95);color:#fff}
.badge-closed{background:rgba(231,76,60,0.95);color:#fff}
.badge-live{background:var(--live);color:#fff}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse-dot 1.4s infinite}
.badge-soon{background:rgba(212,175,55,0.2);color:var(--gold);border:1px solid rgba(212,175,55,0.4)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}

.fav-rest{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(10,25,41,0.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:all .2s}
html[dir="ltr"] .fav-rest{right:auto;left:12px}
.fav-rest:active{transform:scale(0.9)}
.fav-rest svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.fav-rest.active svg{fill:var(--gold);stroke:var(--gold)}

.rest-body{padding:14px}
.rest-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.rest-name{font-size:15px;font-weight:800;line-height:1.3;flex:1}
.rest-rating{display:flex;align-items:center;gap:4px;background:var(--gold-soft);padding:4px 9px;border-radius:8px;flex-shrink:0}
.rest-rating svg{width:12px;height:12px;fill:var(--gold);stroke:none}
.rest-rating span{font-size:12px;font-weight:800;color:var(--gold)}
.rest-cuisine{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.5}
.rest-location{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;margin-bottom:10px}
.rest-location svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2}

.rest-actions-row{display:flex;gap:8px;align-items:stretch;padding-top:12px;border-top:1px solid rgba(212,175,55,0.1)}

.info-btn{width:46px;height:46px;border-radius:12px;flex-shrink:0;background:var(--gold-soft);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer}
.info-btn:active{transform:scale(0.94);background:var(--gold)}
.info-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2}
.info-btn:active svg{stroke:var(--navy)}

.rest-meta-quick{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);padding-inline-start:6px}
.rest-meta-quick span{display:flex;align-items:center;gap:5px}
.rest-meta-quick svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2}
.plus-code{font-size:10px;font-family:monospace;direction:ltr;padding:2px 7px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.25);border-radius:5px;color:var(--gold);font-weight:700}

.view-menu-btn{flex:1;height:46px;border-radius:12px;background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(212,175,55,0.3);transition:all .2s}
.view-menu-btn:active{transform:scale(0.97)}
.view-menu-btn svg{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2.5}

.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty svg{width:70px;height:70px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.4}
.empty p{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}

/* ==========================================
   Modal Base
   ========================================== */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,25,41,0.85);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{width:100%;max-width:560px;max-height:90vh;background:linear-gradient(180deg,#132f4c 0%,#0a1929 100%);border-radius:24px 24px 0 0;border-top:1px solid var(--border);overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -20px 60px rgba(0,0,0,0.6);scrollbar-width:none}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:44px;height:4px;border-radius:2px;background:rgba(212,175,55,0.4);margin:10px auto 0}

/* Info Modal */
.info-modal-head{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.info-modal-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:var(--gold)}
.info-modal-title .icon-circle{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.info-modal-title .icon-circle svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.close-x{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.close-x:active{transform:scale(0.9)}
.close-x svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.5}
.info-modal-body{padding:8px 20px 20px}
.rest-name-big{font-size:20px;font-weight:900;color:var(--text);margin-bottom:4px}
.rest-en-big{font-size:11.5px;color:var(--text-dim);direction:ltr;text-align:start;margin-bottom:10px;font-family:monospace}
.rest-cuisine-big{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:16px}
.rating-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.2);border-radius:12px;margin-bottom:16px}
.rating-row .r-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-dim)}
.rating-row .r-item svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.rating-row .r-item.highlight svg{fill:var(--gold);stroke:none}
.rating-row .r-item .val{color:var(--gold);font-weight:800}
.info-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.info-row{display:flex;gap:12px;align-items:flex-start;padding:12px;background:rgba(10,25,41,0.4);border:1px solid var(--border);border-radius:12px}
.info-icon{width:40px;height:40px;border-radius:11px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.info-content{flex:1;min-width:0}
.info-label{font-size:10.5px;color:var(--text-dim);font-weight:700;margin-bottom:4px;letter-spacing:0.3px}
.info-value{font-size:13px;color:var(--text);font-weight:600;line-height:1.5;word-break:break-word}
.info-value.phone{direction:ltr;text-align:start;font-family:monospace;color:var(--gold);font-size:14px;font-weight:800}
.info-value.plus-code-value{font-family:monospace;direction:ltr;color:var(--gold);font-weight:800;font-size:14px}
.info-value.hours{color:var(--success);font-weight:700}
.desc-box{background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);border-radius:12px;padding:14px;margin-bottom:16px}
.desc-box-title{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.desc-box-title svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.desc-box-text{font-size:12.5px;color:var(--text-dim);line-height:1.8}
.info-modal-actions{display:flex;gap:10px;padding:8px 20px calc(20px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(180deg,transparent,rgba(10,25,41,0.95) 30%)}

.modal-action-btn{flex:1;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;transition:all .2s}
.modal-action-btn:active{transform:scale(0.97)}
.modal-action-btn svg{width:18px;height:18px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.modal-action-btn.call{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 6px 20px rgba(46,204,113,0.3)}
.modal-action-btn.call svg{stroke:#fff}
.modal-action-btn.share{background:var(--card);border:1.5px solid var(--border);color:var(--gold)}
.modal-action-btn.share svg{stroke:var(--gold)}
.modal-action-btn.wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 6px 20px rgba(37,211,102,0.35)}
.modal-action-btn.wa svg{stroke:#fff}

/* Menu Modal */
.menu-modal-head{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,175,55,0.1)}
.menu-modal-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:var(--gold)}
.menu-modal-title .icon-circle{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.menu-modal-title .icon-circle svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.menu-modal-body{padding:16px 20px 20px}
.menu-rest-name{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
.menu-rest-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:14px}

.menu-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.menu-tabs::-webkit-scrollbar{display:none}
.menu-tab{flex-shrink:0;padding:8px 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);transition:all .2s}
.menu-tab:active{transform:scale(0.95)}
.menu-tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.menu-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.menu-item{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;animation:fadeUp .3s both}
.menu-item-img{width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#1a3a5c,#0d2137);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.menu-item-img svg{width:36px;height:36px;stroke:var(--gold);fill:none;stroke-width:1.5;opacity:0.5}
.menu-item-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.menu-item-name{font-size:14px;font-weight:800;margin-bottom:4px;line-height:1.3}
.menu-item-desc{font-size:11px;color:var(--text-dim);line-height:1.4;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menu-item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu-item-price{font-size:15px;font-weight:900;color:var(--gold)}
.menu-item-price span{font-size:10px;color:var(--text-dim);font-weight:600}
.add-item-btn{
  padding:8px 12px;border-radius:9px;
  background:var(--gold-soft);border:1.5px solid var(--gold);
  color:var(--gold);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;gap:5px;
  transition:all .2s;flex-shrink:0;
}
.add-item-btn:active{background:var(--gold);color:var(--navy)}
.add-item-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Menu cart footer */
.menu-cart-footer{
  position:sticky;bottom:0;
  padding:12px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(10,25,41,0.95) 20%);
  border-top:1px solid rgba(212,175,55,0.15);
  margin-top:8px;
}
.cart-summary{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#f4d03f,#d4af37);
  border-radius:14px;padding:12px 16px;
  box-shadow:0 10px 30px rgba(212,175,55,0.35);
}
.cart-summary-icon{
  width:44px;height:44px;border-radius:12px;
  background:rgba(10,25,41,0.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;
}
.cart-summary-icon svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:2.5}
.cart-summary-count{
  position:absolute;top:-4px;right:-4px;
  min-width:20px;height:20px;padding:0 5px;
  background:var(--danger);color:#fff;
  font-size:10px;font-weight:800;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);
}
.cart-summary-info{flex:1;min-width:0}
.cart-summary-label{font-size:10.5px;color:rgba(10,25,41,0.75);font-weight:700;margin-bottom:2px}
.cart-summary-total{font-size:16px;font-weight:900;color:var(--navy)}
.cart-summary-btn{
  padding:10px 14px;border-radius:10px;
  background:var(--navy);color:var(--gold);
  font-size:12px;font-weight:800;
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.cart-summary-btn:active{transform:scale(0.95)}
.cart-summary-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Coming Soon */
.coming-soon-box{text-align:center;padding:40px 20px 30px}
.coming-icon{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.03));border:2px dashed rgba(212,175,55,0.4);display:flex;align-items:center;justify-content:center;animation:pulse-glow 2.5s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.3);transform:scale(1)}50%{box-shadow:0 0 0 18px rgba(212,175,55,0);transform:scale(1.03)}}
.coming-icon svg{width:48px;height:48px;stroke:var(--gold);fill:none;stroke-width:1.5}
.coming-title{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:10px}
.coming-text{font-size:13px;color:var(--text-dim);line-height:1.8;max-width:320px;margin:0 auto 20px}
.coming-badge{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.4);font-size:12px;font-weight:800;color:var(--gold)}

/* ========== Floating Cart Bar ========== */
.floating-cart{
  position:fixed;bottom:90px;left:16px;right:16px;z-index:80;
  background:linear-gradient(135deg,#f4d03f,#d4af37);
  border-radius:16px;
  padding:12px 16px;
  display:none;align-items:center;gap:12px;
  box-shadow:0 12px 40px rgba(212,175,55,0.5);
  animation:slideUp .4s cubic-bezier(0.34,1.56,0.64,1);
  max-width:520px;margin:0 auto;
}
.floating-cart.show{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(100px)}to{opacity:1;transform:translateY(0)}}
.fc-icon{
  width:42px;height:42px;border-radius:11px;
  background:rgba(10,25,41,0.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;
}
.fc-icon svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.5}
.fc-count{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--danger);color:#fff;
  font-size:10px;font-weight:800;border-radius:9px;

function toPersianDigits(n){
  const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g,d=>p[d]);
}
function showToast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.className = 'toast', 2400);
}
function checkAuth(){
  const raw = localStorage.getItem('bazaarcheh_session') || sessionStorage.getItem('bazaarcheh_session');
  if(!raw){ location.replace('index.html'); return false; }
  try {
    const s = JSON.parse(raw);
    if(!s || !s.id){ location.replace('index.html'); return false; }
  } catch(e){ location.replace('index.html'); return false; }
  return true;
}

/* ========== Cart Helpers ========== */
function getCart(){
  try { return JSON.parse(localStorage.getItem('bazaarcheh_cart') || '[]'); }
  catch(e){ return []; }
}
function saveCart(c){
  try { localStorage.setItem('bazaarcheh_cart', JSON.stringify(c)); } catch(e){}
}
function updateCartCount(){
  const cart = getCart();
  let total = 0;
  for(let i = 0; i < cart.length; i++) total += cart[i].qty || 1;

  const badge = document.getElementById('topCartBadge');
  if(badge){
    badge.textContent = toPersianDigits(total);
    badge.classList.toggle('show', total > 0);
  }

  const fc = document.getElementById('floatingCart');
  const fcCount = document.getElementById('fcCount');
  const fcTotal = document.getElementById('fcTotal');

  if(total > 0){
    fc.classList.add('show');
    fcCount.textContent = toPersianDigits(total);

    let sum = 0;
    for(let i = 0; i < cart.length; i++) sum += (cart[i].price || 0) * (cart[i].qty || 1);
    fcTotal.textContent = toPersianDigits(sum.toLocaleString('en-US')) + ' افغانی';
  } else {
    fc.classList.remove('show');
  }
}

/* ==========================================
   🛒 Add to Cart
   ========================================== */
function addToCart(menuItemId){
  if(!currentRest) return;
  const item = currentRest.menu.find(m => m.id === menuItemId);
  if(!item) return;

  const cart = getCart();
  const key = 'rest_' + currentRest.id + '_' + menuItemId;

  let existing = null;
  for(let i = 0; i < cart.length; i++){
    if(cart[i].key === key){ existing = cart[i]; break; }
  }

  if(existing){
    existing.qty = (existing.qty || 1) + 1;
  } else {
    cart.push({
      key: key,
      id: menuItemId,
      name: item.name,
      price: item.price,
      qty: 1,
      restId: currentRest.id,
      restName: currentRest.name,
      restPhone: currentRest.phone,
      restWhatsapp: currentRest.whatsapp || ('93' + currentRest.phone.replace(/^0/,''))
    });
  }

  saveCart(cart);
  updateMenuCart();
  updateCartCount();
  showToast('به سبد خرید اضافه شد', 'success');
}

function updateMenuCart(){
  if(!currentRest) return;
  const footer = document.getElementById('menuCartFooter');
  const countEl = document.getElementById('menuCartCount');
  const totalEl = document.getElementById('menuCartTotal');

  if(!footer) return;

  const cart = getCart();
  let total = 0, count = 0, sum = 0;
  for(let i = 0; i < cart.length; i++){
    if(cart[i].restId === currentRest.id){
      count += cart[i].qty || 1;
      sum += (cart[i].price || 0) * (cart[i].qty || 1);
    }
  }

  if(count > 0){
    footer.style.display = 'block';
    countEl.textContent = toPersianDigits(count);
    totalEl.textContent = toPersianDigits(sum.toLocaleString('en-US')) + ' افغانی';
  } else {
    footer.style.display = 'none';
  }
}

/* ==========================================
   📱 WhatsApp Order
   ========================================== */
function sendToWhatsApp(){
  if(!currentRest) return;
  const cart = getCart();
  const restItems = cart.filter(c => c.restId === currentRest.id);

  if(restItems.length === 0){
    showToast('سبد خرید خالی است', 'error');
    return;
  }

  let total = 0;
  let itemsText = '';
  for(let i = 0; i < restItems.length; i++){
    const it = restItems[i];
    const sub = (it.price || 0) * (it.qty || 1);
    total += sub;
    itemsText += `\n• ${it.name} × ${it.qty} = ${sub.toLocaleString('en-US')} افغانی`;
  }

  let userName = 'کاربر بازارچه';
  let userPhone = '';
  try {
    const session = JSON.parse(localStorage.getItem('bazaarcheh_session') || '{}');
    if(session.name) userName = session.name;
    if(session.phone) userPhone = session.phone;
  } catch(e){}

  const message =
    `سلام 🌹\n` +
    `از اپلیکیشن *بازارچه*\n\n` +
    `👤 نام: ${userName}\n` +
    (userPhone ? `📱 شماره: ${userPhone}\n` : '') +
    `🏪 رستورانت: ${currentRest.name}\n` +
    `📍 آدرس: ${currentRest.address}\n\n` +
    `🛒 *سفارش شما:*${itemsText}\n\n` +
    `💰 *جمع کل: ${total.toLocaleString('en-US')} افغانی*\n\n` +
    `لطفاً سفارش من را تایید کنید.`;

  const waNumber = currentRest.whatsapp || ('93' + currentRest.phone.replace(/^0/,''));
  const url = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

  window.open(url, '_blank');
}

/* ========== Actions ========== */
function toggleFav(id, el){
  const i = favorites.indexOf(id);
  if(i > -1){ favorites.splice(i,1); el.classList.remove('active'); }
  else { favorites.push(id); el.classList.add('active'); }
  localStorage.setItem('bazaarcheh_rest_favs', JSON.stringify(favorites));
}

function callRestaurant(){
  if(!currentRest) return;
  setTimeout(() => { window.location.href = 'tel:' + currentRest.phone; }, 300);
  showToast(currentRest.phone);
}

function shareRest(){
  if(!currentRest) return;
  const url = location.origin + location.pathname + '?id=' + currentRest.id;
  if(navigator.share){
    navigator.share({title: currentRest.name, url: url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>showToast('لینک کپی شد', 'success'));
  }
}

function onSearch(v){
  currentSearch = v.trim();
  renderList();
}

/* ========== Init ========== */
if(checkAuth()){
  renderList();
  updateCartCount();
}
</script>
</body>
</html>
