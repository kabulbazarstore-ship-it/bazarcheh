<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>سفارشات من | بازارچه</title>
<style>
:root{
  --navy:#0a1929;--gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;--border:rgba(212,175,55,0.22);
  --danger:#e74c3c;--success:#2ecc71;--warning:#f39c12;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.page{position:relative;z-index:2;min-height:100vh}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--navy),rgba(10,25,41,0.9));backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:15px;font-weight:700;text-align:center;color:var(--gold)}

.wrap{padding:16px;max-width:520px;margin:0 auto}

.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer}
.tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.order-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.order-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(212,175,55,0.1)}
.order-id{font-size:12px;color:var(--text-dim);font-family:monospace;direction:ltr}
.order-status{padding:4px 10px;border-radius:8px;font-size:10.5px;font-weight:800}
.status-pending{background:rgba(243,156,18,0.15);color:var(--warning)}
.status-shipping{background:rgba(52,152,219,0.15);color:#3498db}
.status-delivered{background:rgba(46,204,113,0.15);color:var(--success)}
.status-cancelled{background:rgba(231,76,60,0.15);color:var(--danger)}

.order-items{padding:14px 16px}
.order-item{display:flex;gap:12px;margin-bottom:10px}
.order-item:last-child{margin-bottom:0}
.order-thumb{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#1a3a5c,#0d2137);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.order-thumb svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.5;opacity:0.6}
.order-info{flex:1;min-width:0}
.order-name{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-qty{font-size:11px;color:var(--text-dim)}
.order-price{font-size:13px;font-weight:900;color:var(--gold);margin-top:3px}

.order-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(212,175,55,0.05);border-top:1px solid rgba(212,175,55,0.1)}
.order-total-label{font-size:11.5px;color:var(--text-dim);margin-bottom:2px}
.order-total{font-size:15px;font-weight:900;color:var(--gold)}
.order-actions{display:flex;gap:6px}
.order-btn{padding:8px 14px;border-radius:10px;font-size:11px;font-weight:800;border:1.5px solid var(--border);background:transparent;color:var(--text)}
.order-btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.order-btn:active{transform:scale(0.95)}

.empty{text-align:center;padding:80px 20px;color:var(--text-dim)}
.empty svg{width:80px;height:80px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.4}
.empty p{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text)}
.empty span{font-size:12.5px;line-height:1.7}
.empty-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:12px 22px;border-radius:12px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:800;text-decoration:none}
.empty-btn:active{transform:scale(0.97)}
.empty-btn svg{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2.5}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="page-title">سفارشات من</div>
    <button class="icon-btn" style="visibility:hidden"><svg viewBox="0 0 24 24"></svg></button>
  </div>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" onclick="setTab('all',this)">همه</div>
      <div class="tab" onclick="setTab('pending',this)">در انتظار</div>
      <div class="tab" onclick="setTab('shipping',this)">در راه</div>
      <div class="tab" onclick="setTab('delivered',this)">تحویل شده</div>
      <div class="tab" onclick="setTab('cancelled',this)">لغو شده</div>
    </div>
    <div id="ordersList"></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </a>
    <a href="restaurants.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
      <span>رستورانت</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      <span>چت</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>پروفایل</span>
    </a>
  </nav>

</div>

<script>
/* Demo orders — بعداً از localStorage می‌خونیم */
const ORDERS = [
  {
    id:'BZ-2451',
    status:'shipping',
    date:'امروز - ۱۰:۳۰',
    items:[
      {name:'پیراهن افغانی گلدوزی‌شده', qty:1, price:1200},
      {name:'شال ابریشم هراتی', qty:1, price:2000}
    ],
    total: 3200
  },
  {
    id:'BZ-2450',
    status:'delivered',
    date:'دیروز - ۱۸:۴۵',
    items:[
      {name:'منتو گوشت — رستورانت مهتاب', qty:2, price:350}
    ],
    total: 700
  },
  {
    id:'BZ-2449',
    status:'pending',
    date:'دیروز - ۱۴:۲۰',
    items:[
      {name:'عطر گل محمدی', qty:1, price:850}
    ],
    total: 850
  },
  {
    id:'BZ-2448',
    status:'cancelled',
    date:'۲ روز پیش',
    items:[
      {name:'رژ لب مات رزگلد', qty:1, price:450}
    ],
    total: 450
  }
];

let currentTab = 'all';

const STATUS_LABELS = {
  pending:'در انتظار',
  shipping:'در راه',
  delivered:'تحویل شده',
  cancelled:'لغو شده'
};

function setTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  const list = document.getElementById('ordersList');
  const filtered = currentTab === 'all' ? ORDERS : ORDERS.filter(o => o.status === currentTab);

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
        <p>هیچ سفارشی اینجا نیست</p>
        <span>وقتی اولین سفارشت رو ثبت کنی، اینجا نمایش داده می‌شه</span>
        <a href="shop.html" class="empty-btn">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span>شروع خرید</span>
        </a>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="order-card">
      <div class="order-head">
        <div class="order-id">#${o.id}</div>
        <div class="order-status status-${o.status}">${STATUS_LABELS[o.status]}</div>
      </div>
      <div class="order-items">
        ${o.items.map(item => `
          <div class="order-item">
            <div class="order-thumb">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </div>
            <div class="order-info">
              <div class="order-name">${item.name}</div>
              <div class="order-qty">${item.qty} × ${item.price.toLocaleString('en-US')} افغانی</div>
              <div class="order-price">${(item.qty * item.price).toLocaleString('en-US')} افغانی</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="order-foot">
        <div>
          <div class="order-total-label">جمع کل</div>
          <div class="order-total">${o.total.toLocaleString('en-US')} افغانی</div>
        </div>
        <div class="order-actions">
          ${o.status === 'shipping' ? `<button class="order-btn primary">پیگیری</button>` : ''}
          ${o.status === 'delivered' ? `<button class="order-btn primary">دوباره سفارش</button>` : ''}
          ${o.status === 'pending' ? `<button class="order-btn">لغو</button>` : ''}
          ${o.status === 'cancelled' ? `<button class="order-btn">جزئیات</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
