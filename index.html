<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>بازارچه | Bazaarcheh</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:rgba(19,47,76,0.6);
  --border:rgba(212,175,55,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:Tahoma,'Segoe UI',sans-serif;
  background:var(--navy);color:var(--text);
  overflow:hidden;height:100vh;width:100vw;
  position:fixed;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* ==========================================
   🌟 SPLASH SCREEN (2 seconds)
   ========================================== */
.splash{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
  transition:opacity .6s ease, visibility .6s;
}
.splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-orb{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:0.6;
  animation:float 20s ease-in-out infinite;
}
.splash-orb.so1{
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(212,175,55,0.6),transparent 70%);
  top:-90px;right:-90px;
}
.splash-orb.so2{
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(26,90,150,0.7),transparent 70%);
  bottom:-80px;left:-80px;
  animation-delay:-7s;
}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.1)}
  66%{transform:translate(-30px,40px) scale(0.95)}
}

.splash-logo{
  width:130px;height:130px;
  border-radius:36px;
  background:linear-gradient(145deg,#1a3a5c 0%,#0a1929 100%);
  border:1.5px solid rgba(212,175,55,0.5);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:
    0 20px 50px rgba(0,0,0,0.5),
    0 0 0 1px rgba(212,175,55,0.15),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation:splashLogoIn .9s cubic-bezier(0.34,1.56,0.64,1) both;
  z-index:1;
}
.splash-logo::before{
  content:'';position:absolute;inset:-18px;border-radius:48px;
  background:radial-gradient(circle,rgba(212,175,55,0.2),transparent 70%);
  z-index:-1;
  animation:splashPulse 2s ease-in-out infinite;
}
.splash-logo::after{
  content:'';position:absolute;inset:-10px;border-radius:42px;
  border:2px dashed rgba(212,175,55,0.35);
  animation:spin 20s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashLogoIn{
  0%{transform:scale(0.3) rotate(-20deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}
@keyframes splashPulse{
  0%,100%{opacity:0.5;transform:scale(1)}
  50%{opacity:1;transform:scale(1.1)}
}
.splash-letter{
  font-size:78px;font-weight:900;color:#f4d03f;
  text-shadow:
    0 0 25px rgba(244,208,63,0.8),
    0 4px 20px rgba(212,175,55,0.7);
  line-height:1;
  animation:letterPulse 2s ease-in-out infinite;
}
@keyframes letterPulse{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.06);filter:brightness(1.2)}
}

.splash-brand{
  font-size:32px;font-weight:900;
  color:#f4d03f;
  text-shadow:
    0 0 20px rgba(244,208,63,0.6),
    0 3px 12px rgba(212,175,55,0.5);
  letter-spacing:2px;
  margin-top:8px;
  animation:splashTextIn .8s .3s both;
  z-index:1;
}
.splash-sub{
  font-size:12px;font-weight:700;letter-spacing:6px;
  color:var(--text-dim);text-transform:uppercase;
  animation:splashTextIn .8s .5s both;
  z-index:1;
}
@keyframes splashTextIn{
  0%{opacity:0;transform:translateY(15px)}
  100%{opacity:1;transform:translateY(0)}
}

.splash-loader{
  display:flex;gap:6px;margin-top:30px;
  animation:splashTextIn .8s .7s both;
  z-index:1;
}
.splash-loader span{
  width:8px;height:8px;border-radius:50%;
  background:var(--gold);
  animation:dotBounce 1.4s ease-in-out infinite;
}
.splash-loader span:nth-child(2){animation-delay:0.15s}
.splash-loader span:nth-child(3){animation-delay:0.3s}
@keyframes dotBounce{
  0%,60%,100%{transform:translateY(0);opacity:0.4}
  30%{transform:translateY(-12px);opacity:1}
}

/* ==========================================
   📄 MAIN PAGE
   ========================================== */
.main-page{
  opacity:0;
  transition:opacity .5s ease;
}
.main-page.show{opacity:1}

.bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),
    radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),
    linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%);
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:0.55;
  animation:float 20s ease-in-out infinite;
}
.orb.o1{width:300px;height:300px;background:radial-gradient(circle,rgba(212,175,55,0.6),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:260px;height:260px;background:radial-gradient(circle,rgba(26,90,150,0.7),transparent 70%);bottom:-80px;left:-80px;animation-delay:-7s}
.orb.o3{width:180px;height:180px;background:radial-gradient(circle,rgba(212,175,55,0.35),transparent 70%);top:45%;left:5%;animation-delay:-14s}

.grid-lines{
  position:absolute;inset:0;opacity:0.05;
  background-image:
    linear-gradient(rgba(212,175,55,0.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,175,55,0.6) 1px,transparent 1px);
  background-size:44px 44px;
  animation:drift 45s linear infinite;
  mask-image:radial-gradient(circle at center,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at center,#000 20%,transparent 75%);
}
@keyframes drift{from{background-position:0 0}to{background-position:88px 88px}}

.stars{position:absolute;inset:0;pointer-events:none}
.star{
  position:absolute;width:2px;height:2px;
  background:var(--gold);border-radius:50%;opacity:0;
  animation:twinkle 4s ease-in-out infinite;
}
.star:nth-child(odd){background:#fff;width:1.4px;height:1.4px}
.star:nth-child(3n){animation-duration:6.5s}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:0.95;transform:scale(1.4)}
}

.wrap{
  position:relative;z-index:2;
  height:100vh;width:100%;
  display:flex;flex-direction:column;
  align-items:center;
  padding:20px 22px calc(20px + env(safe-area-inset-bottom));
  overflow-y:auto;
}
.wrap::-webkit-scrollbar{display:none}

.lang-top{
  align-self:flex-end;
  display:flex;gap:4px;
  background:var(--card);backdrop-filter:blur(12px);
  padding:4px;border-radius:12px;
  border:1px solid var(--border);
}
.lang-top button{
  padding:8px 16px;border-radius:9px;
  font-size:12px;font-weight:700;color:var(--text-dim);
  transition:all .25s;
}
.lang-top button.active{
  background:var(--gold);color:var(--navy);
  box-shadow:0 2px 10px rgba(212,175,55,0.5);
}
.lang-top button:active{transform:scale(0.94)}

.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  width:100%;max-width:420px;
  padding:16px 0;gap:16px;
}

.logo-card{
  width:110px;height:110px;border-radius:30px;
  background:linear-gradient(145deg,#1a3a5c 0%,#0a1929 100%);
  border:1.5px solid rgba(212,175,55,0.5);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:
    0 20px 50px rgba(0,0,0,0.5),
    0 0 0 1px rgba(212,175,55,0.15),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation:logoIn .9s cubic-bezier(0.34,1.56,0.64,1) both;
}
.logo-card::before{
  content:'';position:absolute;inset:-14px;border-radius:42px;
  background:radial-gradient(circle,rgba(212,175,55,0.15),transparent 70%);
  z-index:-1;
}
.logo-card::after{
  content:'';position:absolute;inset:-8px;border-radius:36px;
  border:2px dashed rgba(212,175,55,0.25);
  animation:spin 30s linear infinite;
}
@keyframes logoIn{
  0%{transform:scale(0.4) rotate(-15deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.logo-letter{
  font-size:64px;font-weight:900;color:#f4d03f;
  text-shadow:
    0 0 20px rgba(244,208,63,0.7),
    0 4px 15px rgba(212,175,55,0.6);
  line-height:1;
  animation:letterFloat 3s ease-in-out infinite;
}
@keyframes letterFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.brand-wrap{text-align:center;animation:fadeUp .8s .3s both}
.brand-main{
  font-size:46px;font-weight:900;letter-spacing:1px;
  color:#f4d03f;
  text-shadow:
    0 0 25px rgba(244,208,63,0.5),
    0 4px 15px rgba(212,175,55,0.4);
  line-height:1.2;
}
.brand-en{
  font-size:13px;font-weight:700;letter-spacing:7px;
  color:var(--text-dim);text-transform:uppercase;
  margin-top:6px;
}
.brand-icons{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin-top:12px;
  font-size:12px;font-weight:600;
  color:var(--gold);flex-wrap:wrap;
}
.brand-icons .dot{color:var(--text-dim);font-weight:400}
.brand-icons svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2}

.tagline{
  text-align:center;font-size:13.5px;line-height:1.8;
  color:var(--text-dim);max-width:340px;
  animation:fadeUp .8s .5s both;
  padding:0 8px;
}
.tagline b{color:var(--gold);font-weight:700}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

.features{
  display:flex;flex-wrap:wrap;gap:7px;
  justify-content:center;margin-top:2px;
  animation:fadeUp .8s .7s both;
}
.feat-chip{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:20px;
  background:var(--card);backdrop-filter:blur(8px);
  border:1px solid var(--border);
  font-size:11px;font-weight:600;color:var(--text);
}
.feat-chip svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2}

.cta{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;gap:12px;
  padding-bottom:8px;
}
.btn{
  height:60px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:16px;font-weight:800;
  transition:all .2s;
  position:relative;overflow:hidden;
  text-decoration:none;
}
.btn:active{transform:scale(0.97)}
.btn-primary{
  background:linear-gradient(135deg,#f4d03f 0%,#d4af37 50%,#b8941f 100%);
  color:var(--navy);
  box-shadow:0 12px 32px rgba(212,175,55,0.4);
  animation:fadeUp .8s .9s both;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.45) 50%,transparent 60%);
  transform:translateX(-100%);
  transition:transform .7s;
}
.btn-primary:active::before{transform:translateX(100%)}
.btn svg{
  width:24px;height:24px;
  stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.footer{
  text-align:center;font-size:11px;color:var(--text-dim);
  padding-top:16px;
  animation:fadeUp .8s 1.1s both;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.footer .heart{
  display:inline-block;color:var(--gold);
  animation:heartbeat 1.4s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}
</style>
</head>
<body>

<!-- ==========================================
     🌟 SPLASH SCREEN
     ========================================== -->
<div class="splash" id="splash">
  <div class="splash-orb so1"></div>
  <div class="splash-orb so2"></div>

  <div class="splash-logo">
    <div class="splash-letter">B</div>
  </div>

  <div class="splash-brand">بازارچه</div>
  <div class="splash-sub">BAZAARCHEH</div>

  <div class="splash-loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- ==========================================
     📄 MAIN PAGE
     ========================================== -->
<div class="main-page" id="mainPage" style="display:none">

  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grid-lines"></div>
    <div class="stars" id="stars"></div>
  </div>

  <div class="wrap">

    <div class="lang-top">
      <button data-lang="fa" class="active" onclick="setLang('fa')">دری</button>
      <button data-lang="ps" onclick="setLang('ps')">پښتو</button>
      <button data-lang="en" onclick="setLang('en')">English</button>
    </div>

    <div class="main">

      <div class="logo-card">
        <div class="logo-letter">B</div>
      </div>

      <div class="brand-wrap">
        <div class="brand-main" id="brandMain">بازارچه</div>
        <div class="brand-en">BAZAARCHEH</div>
        <div class="brand-icons">
          <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="ic1">خرید</span>
          <span class="dot">•</span>
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span data-i18n="ic2">سلامت</span>
          <span class="dot">•</span>
          <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span data-i18n="ic3">آموزش</span>
        </div>
      </div>

      <p class="tagline" id="tagline">
        بازارچه — بازاری کوچک اما پُر از <b>رنگ و زندگی افغانی</b>؛ هر چه در دل داری، اینجا پیدا می‌کنی
      </p>

      <div class="features">
        <div class="feat-chip">
          <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="feat1">خرید آسان</span>
        </div>
        <div class="feat-chip">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span data-i18n="feat2">دست‌ساز افغانی</span>
        </div>
        <div class="feat-chip">
          <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span data-i18n="feat3">ارسال سریع</span>
        </div>
      </div>

    </div>

    <div class="cta">
      <a href="enter.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <span data-i18n="enterBtn">ثبت‌نام / ورود</span>
      </a>

      <div class="footer">
        <span data-i18n="madeWith">ساخته شده با</span>
        <span class="heart">♥</span>
        <span data-i18n="forPeople">برای مردم افغانستان</span>
      </div>
    </div>

  </div>

</div>

<script>
/* ==========================================
   🌐 Translations
   ========================================== */
const T = {
  fa:{
    brandMain:'بازارچه',
    tagline:'بازارچه — بازاری کوچک اما پُر از <b>رنگ و زندگی افغانی</b>؛ هر چه در دل داری، اینجا پیدا می‌کنی',
    ic1:'خرید',ic2:'سلامت',ic3:'آموزش',
    feat1:'خرید آسان',feat2:'دست‌ساز افغانی',feat3:'ارسال سریع',
    enterBtn:'ثبت‌نام / ورود',
    madeWith:'ساخته شده با',forPeople:'برای مردم افغانستان'
  },
  ps:{
    brandMain:'بازارچه',
    tagline:'بازارچه — کوچنی بازار خو د <b>افغاني رنګ او ژوند</b> څخه ډک؛ هر څه چې زړه غواړي، دلته مومي',
    ic1:'پیرود',ic2:'روغتیا',ic3:'زده کړه',
    feat1:'اسانه پیرود',feat2:'افغاني لاسي',feat3:'چټک لیږد',
    enterBtn:'نوم لیکنه / ننوتل',
    madeWith:'جوړ شوی د',forPeople:'د افغانستان خلکو لپاره'
  },
  en:{
    brandMain:'Bazaarcheh',
    tagline:'Bazaarcheh — a small bazaar full of <b>Afghan color and life</b>; whatever your heart desires, you\'ll find it here',
    ic1:'Shop',ic2:'Health',ic3:'Learn',
    feat1:'Easy Shopping',feat2:'Afghan Handmade',feat3:'Fast Delivery',
    enterBtn:'Sign Up / Login',
    madeWith:'Made with',forPeople:'for the people of Afghanistan'
  }
};

let currentLang = localStorage.getItem('bazaarcheh_lang') || 'fa';

/* ==========================================
   ⭐ Generate Stars
   ========================================== */
function makeStars(){
  const box = document.getElementById('stars');
  if(!box) return;
  let html = '';
  for(let i = 0; i < 28; i++){
    const top = (Math.random() * 100).toFixed(2);
    const left = (Math.random() * 100).toFixed(2);
    const delay = (Math.random() * 4).toFixed(2);
    const dur = (3 + Math.random() * 3.5).toFixed(2);
    html += `<span class="star" style="top:${top}%;left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s"></span>`;
  }
  box.innerHTML = html;
}

/* ==========================================
   🌐 setLang
   ========================================== */
function setLang(lang){
  if(!T[lang]) lang = 'fa';
  currentLang = lang;
  localStorage.setItem('bazaarcheh_lang', lang);

  const html = document.documentElement;
  html.lang = lang === 'en' ? 'en' : 'fa';
  html.dir  = lang === 'en' ? 'ltr' : 'rtl';

  document.querySelectorAll('.lang-top button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  const brandMain = document.getElementById('brandMain');
  if(brandMain) brandMain.textContent = T[lang].brandMain;

  const tagline = document.getElementById('tagline');
  if(tagline) tagline.innerHTML = T[lang].tagline;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(T[lang][key] !== undefined){
      el.textContent = T[lang][key];
    }
  });

  const splashBrand = document.querySelector('.splash-brand');
  if(splashBrand) splashBrand.textContent = T[lang].brandMain;

  document.title = (lang === 'en' ? 'Bazaarcheh' : T[lang].brandMain) + ' | ' + T[lang].brandMain;
}

/* ==========================================
   🔍 Check Session
   ========================================== */
function checkSession(){
  try {
    const session = localStorage.getItem('bazaarcheh_session')
                 || sessionStorage.getItem('bazaarcheh_session');
    if(session){
      const s = JSON.parse(session);
      if(s && s.id){
        return true;
      }
    }
  } catch(e){
    localStorage.removeItem('bazaarcheh_session');
    sessionStorage.removeItem('bazaarcheh_session');
  }
  return false;
}

/* ==========================================
   🎬 Show Main / Go Home
   ========================================== */
function showMainPage(){
  const splash = document.getElementById('splash');
  const mainPage = document.getElementById('mainPage');

  splash.classList.add('hide');
  mainPage.style.display = 'block';

  requestAnimationFrame(() => {
    mainPage.classList.add('show');
  });
}

function goHome(){
  const splash = document.getElementById('splash');
  splash.classList.add('hide');

  setTimeout(() => {
    location.replace('home.html');
  }, 300);
}

/* ==========================================
   🚀 INIT
   ========================================== */
(function init(){
  setLang(currentLang);
  makeStars();

  // پاک‌سازی sessionهای قدیمی
  try {
    ['banovan_session', 'bazaar_session', 'banovan_lang', 'banovan_users'].forEach(k => {
      localStorage.removeItem(k);
    });
  } catch(e){}

  const isLoggedIn = checkSession();

  // 2 ثانیه splash
  setTimeout(() => {
    if(isLoggedIn){
      goHome();
    } else {
      showMainPage();
    }
  }, 2000);
})();
</script>
