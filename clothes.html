<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>لباس | بازارچه</title>
<style>
:root{--navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;--gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);--text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;--border:rgba(212,175,55,0.22);--danger:#e74c3c;--success:#2ecc71}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:280px;height:280px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:240px;height:240px;background:radial-gradient(circle,rgba(26,90,150,0.65),transparent 70%);bottom:-80px;left:-80px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}

.page{position:relative;z-index:2;min-height:100vh}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.92));backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,175,55,0.15);padding:12px 16px}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92);background:var(--gold-soft)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:16px;font-weight:800;text-align:center;color:var(--gold)}

.search-wrap{position:relative}
.search-wrap input{width:100%;height:46px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0 44px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-wrap .si{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.search-wrap .mic{position:absolute;top:50%;left:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}

.main-tabs{display:flex;gap:12px;padding:16px;max-width:520px;margin:0 auto}
.main-tab{flex:1;padding:18px 14px;border-radius:18px;background:var(--card);border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .25s}
.main-tab:active{transform:scale(0.97)}
.main-tab.active{border-color:var(--gold);background:linear-gradient(145deg,rgba(212,175,55,0.2),rgba(212,175,55,0.05));box-shadow:0 8px 25px rgba(212,175,55,0.25)}
.main-tab-icon{width:56px;height:56px;border-radius:16px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;transition:all .3s}
.main-tab.active .main-tab-icon{background:linear-gradient(135deg,#f4d03f,#d4af37)}
.main-tab-icon svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main-tab.active .main-tab-icon svg{stroke:var(--navy)}
.main-tab-name{font-size:13px;font-weight:800;color:var(--text);text-align:center}
.main-tab.active .main-tab-name{color:var(--gold)}
.main-tab-sub{font-size:10px;color:var(--text-dim)}
.main-tab.active .main-tab-sub{color:var(--gold);opacity:0.8}

.province-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;max-width:520px;margin:0 auto;scrollbar-width:none}
.province-scroll::-webkit-scrollbar{display:none}
.province-chip{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);transition:all .2s}
.province-chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;max-width:520px;margin:0 auto}
.section-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title .accent{display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.section-count{font-size:11.5px;color:var(--text-dim)}

.wrap{padding:0 16px 30px;max-width:520px;margin:0 auto}

.loading-box{text-align:center;padding:60px 20px}
.spinner{width:50px;height:50px;border:3px solid rgba(212,175,55,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box p{font-size:13px;color:var(--text-dim)}

.entity-list{display:flex;flex-direction:column;gap:14px}
.entity-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;transition:transform .2s;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.entity-card:active{transform:scale(0.99)}
.entity-cover{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.entity-cover .cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.entity-cover svg.cover-icon{width:70px;height:70px;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4;position:relative;z-index:0}
.entity-badges{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
html[dir="ltr"] .entity-badges{left:auto;right:12px}
.entity-badge{padding:5px 10px;border-radius:8px;font-size:10px;font-weight:800;backdrop-filter:blur(8px);display:flex;align-items:center;gap:4px}
.badge-featured{background:var(--gold);color:var(--navy)}
.badge-open{background:rgba(46,204,113,0.95);color:#fff}
.badge-live{background:var(--danger);color:#fff}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse-dot 1.4s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}

.fav-entity{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(10,25,41,0.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:all .2s}
html[dir="ltr"] .fav-entity{right:auto;left:12px}
.fav-entity:active{transform:scale(0.9)}
.fav-entity svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.fav-entity.active svg{fill:var(--gold);stroke:var(--gold)}

.entity-body{padding:14px}
.entity-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.entity-name{font-size:15px;font-weight:800;line-height:1.3;flex:1}
.entity-rating{display:flex;align-items:center;gap:4px;background:var(--gold-soft);padding:4px 9px;border-radius:8px;flex-shrink:0}
.entity-rating svg{width:12px;height:12px;fill:var(--gold);stroke:none}
.entity-rating span{font-size:12px;font-weight:800;color:var(--gold)}
.entity-cuisine{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.5}
.entity-location{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;margin-bottom:10px}
.entity-location svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2}

.entity-actions{display:flex;gap:8px;align-items:stretch;padding-top:12px;border-top:1px solid rgba(212,175,55,0.1)}
.info-btn{width:46px;height:46px;border-radius:12px;flex-shrink:0;background:var(--gold-soft);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;transition:all .2s}
.info-btn:active{transform:scale(0.94);background:var(--gold)}
.info-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2}
.info-btn:active svg{stroke:var(--navy)}
.meta-quick{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);padding-inline-start:6px}
.meta-quick span{display:flex;align-items:center;gap:5px}
.meta-quick svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2}
.view-btn{flex:1;height:46px;border-radius:12px;background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(212,175,55,0.3);transition:all .2s}
.view-btn:active{transform:scale(0.97)}
.view-btn svg{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2.5}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s;position:relative}
.product-card:active{transform:scale(0.97)}
.product-img{position:relative;width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.product-img svg.ph{width:50%;height:50%;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4;position:relative;z-index:0}
.product-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;z-index:2}
.product-badge.sale{background:var(--danger);color:#fff}
.product-info{padding:11px}
.product-name{font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:7px;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.product-price{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.price-now{font-size:14.5px;font-weight:900;color:var(--gold)}
.price-old{font-size:10px;color:var(--text-dim);text-decoration:line-through}
.price-cur{font-size:9px;color:var(--text-dim)}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty svg{width:70px;height:70px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.4}
.empty p{font-size:14px;font-weight:700;color:var(--text)}
.empty span{font-size:12px;display:block;margin-top:6px}

.error-box{text-align:center;padding:40px 20px}
.error-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:rgba(231,76,60,0.15);display:flex;align-items:center;justify-content:center}
.error-icon svg{width:36px;height:36px;stroke:var(--danger);fill:none;stroke-width:2}
.error-title{font-size:15px;font-weight:800;color:var(--danger);margin-bottom:8px}
.error-text{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:16px}
.retry-btn{padding:10px 22px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:800}

.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,25,41,0.85);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{width:100%;max-width:560px;max-height:92vh;background:linear-gradient(180deg,#132f4c 0%,#0a1929 100%);border-radius:24px 24px 0 0;border-top:1px solid var(--border);overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -20px 60px rgba(0,0,0,0.6);scrollbar-width:none}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:44px;height:4px;border-radius:2px;background:rgba(212,175,55,0.4);margin:10px auto 0}

.modal-header{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,175,55,0.1)}
.modal-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:var(--gold)}
.modal-title .icon-circle{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.modal-title .icon-circle svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.close-x{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.close-x:active{transform:scale(0.9)}
.close-x svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.5}

.modal-body{padding:16px 20px 20px}
.entity-name-big{font-size:20px;font-weight:900;color:var(--text);margin-bottom:4px}
.entity-en-big{font-size:11.5px;color:var(--text-dim);direction:ltr;text-align:start;margin-bottom:10px;font-family:monospace}
.entity-cuisine-big{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:16px}
.rating-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.2);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.rating-row .r-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-dim)}
.rating-row .r-item svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.rating-row .r-item.highlight svg{fill:var(--gold);stroke:none}
.rating-row .r-item .val{color:var(--gold);font-weight:800}

.info-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.info-row{display:flex;gap:12px;align-items:flex-start;padding:12px;background:rgba(10,25,41,0.4);border:1px solid var(--border);border-radius:12px}
.info-icon{width:40px;height:40px;border-radius:11px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.info-content{flex:1;min-width:0}
.info-label{font-size:10.5px;color:var(--text-dim);font-weight:700;margin-bottom:4px}
.info-value{font-size:13px;color:var(--text);font-weight:600;line-height:1.5;word-break:break-word}
.info-value.phone{direction:ltr;text-align:start;font-family:monospace;color:var(--gold);font-size:14px;font-weight:800}
.info-value.plus-code-value{font-family:monospace;direction:ltr;color:var(--gold);font-weight:800}
.info-value.hours{color:var(--success);font-weight:700}

.desc-box{background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);border-radius:12px;padding:14px;margin-bottom:16px}
.desc-box-title{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.desc-box-title svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.desc-box-text{font-size:12.5px;color:var(--text-dim);line-height:1.8}

.modal-actions-bottom{display:flex;gap:10px;padding:12px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(10,25,41,0.95) 30%);position:sticky;bottom:0;border-top:1px solid rgba(212,175,55,0.1)}
.modal-action-btn{flex:1;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;transition:all .2s}
.modal-action-btn:active{transform:scale(0.97)}
.modal-action-btn svg{width:20px;height:20px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.modal-action-btn.call{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 6px 20px rgba(46,204,113,0.3)}
.modal-action-btn.call svg{stroke:#fff}
.modal-action-btn.share{background:var(--card);border:1.5px solid var(--border);color:var(--gold)}
.modal-action-btn.share svg{stroke:var(--gold)}

.view-tabs{display:flex;gap:8px;padding:12px 20px 0;border-bottom:1px solid rgba(212,175,55,0.1)}
.view-tab{flex:1;padding:12px 8px;border-radius:12px 12px 0 0;background:transparent;border:none;font-size:12.5px;font-weight:800;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;position:relative}
.view-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.view-tab.active{color:var(--gold);background:var(--gold-soft)}
.view-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--gold);border-radius:2px 2px 0 0}

.view-content{padding:16px 20px 20px}

.product-modal-img{position:relative;height:240px;background:linear-gradient(135deg,#1a3a5c,#0d2137);display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-modal-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.product-modal-img svg.big{width:90px;height:90px;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4;position:relative;z-index:0}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(10,25,41,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:3}
.modal-close:active{transform:scale(0.9)}
.modal-close svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5}
.modal-name{font-size:20px;font-weight:900;margin-bottom:8px}
.size-row{margin-bottom:16px}
.size-label{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:10px}
.size-options{display:flex;gap:8px;flex-wrap:wrap}
.size-btn{min-width:48px;height:44px;padding:0 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);font-size:13px;font-weight:800;color:var(--text-dim);display:flex;align-items:center;justify-content:center}
.size-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.qty-box{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qty-label{font-size:12px;color:var(--text-dim);font-weight:700;flex:1}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:4px}
.qty-btn{width:36px;height:36px;border-radius:9px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.qty-btn svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2.5}
.qty-value{font-size:16px;font-weight:900;color:var(--text);min-width:32px;text-align:center}
.price-box{display:flex;align-items:center;justify-content:space-between;padding:16px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);border-radius:14px}
.price-box-label{font-size:12px;color:var(--text-dim);font-weight:700}
.price-box-value{font-size:24px;font-weight:900;color:var(--gold)}
.price-box-value span{font-size:12px;color:var(--text-dim);font-weight:600}

.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:var(--navy);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:800;z-index:400;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,0.45);white-space:nowrap;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
</style>
</head>

<script>
/* ==========================================
   CDN URL + Image Base
   ========================================== */
var CDN = 'https://cdn.jsdelivr.net/gh/kabulbazarstore-ship-it/bazarcheh-data@main';
var IMG = CDN + '/images/clothes';

/* ==========================================
   State
   ========================================== */
var DESIGNERS = [];
var SHOPS = [];
var PROVINCES = [];
var mainTab = 'designers';
var currentProvince = 'all';
var currentSearch = '';
var favorites = JSON.parse(localStorage.getItem('bazaarcheh_favs') || '[]');
var currentViewEntity = null;
var currentViewTab = 'products';
var currentShopCat = 'women';
var selectedQty = 1;
var currentProductData = null;

/* ==========================================
   Helpers
   ========================================== */
function toPersianDigits(n){
  var p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g, function(d){ return p[d]; });
}
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = 'toast'; }, 2400);
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ==========================================
   Load Data from CDN
   ========================================== */
function loadJSON(path){
  return fetch(CDN + path).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + path);
    return r.json();
  });
}

function loadAll(){
  return Promise.all([
    loadJSON('/data/clothes/designers.json'),
    loadJSON('/data/clothes/shops.json')
  ]).then(function(results){
    DESIGNERS = results[0].designers || [];
    SHOPS = results[1].shops || [];
    PROVINCES = results[1].provinces || [{id:'all', name:'همه ولایات'}];
  });
}

/* ==========================================
   Main Tabs
   ========================================== */
function selectMainTab(tab){
  mainTab = tab;
  document.getElementById('tabDesigners').classList.toggle('active', tab === 'designers');
  document.getElementById('tabShops').classList.toggle('active', tab === 'shops');
  document.getElementById('provinceScroll').style.display = tab === 'shops' ? 'flex' : 'none';
  renderAll();
}

/* ==========================================
   Province Filters
   ========================================== */
function renderProvinceFilters(){
  var el = document.getElementById('provinceScroll');
  var html = '';
  for(var i = 0; i < PROVINCES.length; i++){
    var p = PROVINCES[i];
    var active = currentProvince === p.id ? ' active' : '';
    html += '<button class="province-chip' + active + '" onclick="selectProvince(\'' + p.id + '\')">' + p.name + '</button>';
  }
  el.innerHTML = html;
}
function selectProvince(id){
  currentProvince = id;
  renderProvinceFilters();
  renderAll();
}

/* ==========================================
   Filtered Data
   ========================================== */
function getFiltered(){
  if(mainTab === 'designers'){
    var arr = DESIGNERS.slice();
    if(currentSearch){
      var q = currentSearch.toLowerCase();
      arr = arr.filter(function(d){
        return (d.name||'').toLowerCase().indexOf(q) > -1 ||
               (d.specialty || '').toLowerCase().indexOf(q) > -1 ||
               (d.area || '').toLowerCase().indexOf(q) > -1;
      });
    }
    return arr;
  } else {
    var arr = SHOPS.slice();
    if(currentProvince !== 'all'){
      arr = arr.filter(function(s){ return s.province === currentProvince; });
    }
    if(currentSearch){
      var q2 = currentSearch.toLowerCase();
      arr = arr.filter(function(s){
        return (s.name||'').toLowerCase().indexOf(q2) > -1 ||
               (s.specialty || '').toLowerCase().indexOf(q2) > -1 ||
               (s.area || '').toLowerCase().indexOf(q2) > -1;
      });
    }
    return arr;
  }
}

/* ==========================================
   Render All
   ========================================== */
function renderAll(){
  var el = document.getElementById('contentArea');
  var arr = getFiltered();
  
  document.getElementById('sectionTitle').textContent = 
    mainTab === 'designers' ? 'طراحان و خیاطی‌ها' : 'فروشگاه‌های لباس';
  document.getElementById('resultCount').textContent = toPersianDigits(arr.length) + ' نتیجه';
  
  if(arr.length === 0){
    el.innerHTML = '<div class="empty">'
      + '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
      + '<p>چیزی یافت نشد</p>'
      + '<span>جستجو یا فیلتر را تغییر دهید</span>'
      + '</div>';
    return;
  }
  
  var html = '<div class="entity-list">';
  for(var i = 0; i < arr.length; i++){
    var e = arr[i];
    var isFav = favorites.indexOf(e.id) > -1;
    var isDesigner = mainTab === 'designers';
    
    var coverIcon = isDesigner
      ? '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>'
      : '<path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/>';
    
    /* === IMAGE PATH === */
    var imgFolder = isDesigner ? 'designers' : 'shops';
    var imgSrc = IMG + '/' + imgFolder + '/p' + e.id + '.jpg';
    
    html += '<div class="entity-card">'
      /* COVER with image */
      + '<div class="entity-cover">'
      + '<svg class="cover-icon" viewBox="0 0 24 24">' + coverIcon + '</svg>'
      + '<img class="cover-img" src="' + imgSrc + '" alt="' + escapeHtml(e.name) + '" loading="lazy" onerror="this.style.display=\'none\'">'
      + '<div class="entity-badges">'
      + (e.featured ? '<div class="entity-badge badge-featured">ویژه</div>' : '')
      + (e.open ? '<div class="entity-badge badge-open">باز</div>' : '')
      + '</div>'
      + '<button class="fav-entity' + (isFav ? ' active' : '') + '" onclick="event.stopPropagation();toggleFav(' + e.id + ',this)">'
      + '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
      + '</button>'
      + '</div>'
      /* BODY */
      + '<div class="entity-body">'
      + '<div class="entity-name-row">'
      + '<div class="entity-name">' + escapeHtml(e.name) + '</div>'
      + '<div class="entity-rating">'
      + '<svg viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg>'
      + '<span>' + toPersianDigits(e.rating || 0) + '</span>'
      + '</div>'
      + '</div>'
      + '<div class="entity-cuisine">' + escapeHtml(e.specialty || '') + '</div>'
      + '<div class="entity-location">'
      + '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
      + escapeHtml(e.area || '')
      + '</div>'
      + '<div class="entity-actions">'
      + '<button class="info-btn" onclick="event.stopPropagation();openInfo(\'' + mainTab + '\',' + e.id + ')">'
      + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      + '</button>'
      + '<div class="meta-quick">'
      + '<span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' + toPersianDigits(e.experience || 10) + ' سال</span>'
      + '</div>'
      + '<button class="view-btn" onclick="event.stopPropagation();openView(\'' + mainTab + '\',' + e.id + ')">'
      + '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
      + 'مشاهده'
      + '</button>'
      + '</div>'
      + '</div>'
      + '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ==========================================
   Info Modal
   ========================================== */
function openInfo(type, id){
  var e;
  if(type === 'designers'){
    e = DESIGNERS.find(function(d){ return d.id === id; });
  } else {
    e = SHOPS.find(function(s){ return s.id === id; });
  }
  if(!e) return;
  
  var html = '<div class="modal-handle"></div>'
    + '<div class="modal-header">'
    + '<div class="modal-title">'
    + '<div class="icon-circle">'
    + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    + '</div>'
    + '<span>اطلاعات</span>'
    + '</div>'
    + '<button class="close-x" onclick="closeModal(\'infoModal\')">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="modal-body">'
    + '<div class="entity-name-big">' + escapeHtml(e.name) + '</div>'
    + (e.en ? '<div class="entity-en-big">' + escapeHtml(e.en) + '</div>' : '')
    + '<div class="entity-cuisine-big">' + escapeHtml(e.specialty || '') + '</div>'
    + '<div class="rating-row">'
    + '<div class="r-item highlight">'
    + '<svg viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg>'
    + '<span class="val">' + toPersianDigits(e.rating || 0) + '</span>'
    + '</div>'
    + '<div class="r-item">'
    + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>'
    + '<span>' + toPersianDigits(e.reviews || 0) + ' نظر</span>'
    + '</div>'
    + (e.experience ? '<div class="r-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>' + toPersianDigits(e.experience) + ' سال تجربه</span></div>' : '')
    + '</div>'
    + '<div class="info-grid">'
    + '<div class="info-row">'
    + '<div class="info-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>'
    + '<div class="info-content"><div class="info-label">آدرس</div><div class="info-value">' + escapeHtml(e.address || e.area || '') + '</div></div>'
    + '</div>'
    + (e.plusCode ? '<div class="info-row">'
    + '<div class="info-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>'
    + '<div class="info-content"><div class="info-label">پلس کد گوگل مپ</div><div class="info-value plus-code-value">' + escapeHtml(e.plusCode) + '</div></div>'
    + '</div>' : '')
    + '<div class="info-row">'
    + '<div class="info-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>'
    + '<div class="info-content"><div class="info-label">شماره تماس</div><div class="info-value phone">' + escapeHtml(e.phone || '—') + '</div></div>'
    + '</div>'
    + '<div class="info-row">'
    + '<div class="info-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>'
    + '<div class="info-content"><div class="info-label">ساعت کاری</div><div class="info-value hours">' + escapeHtml(e.workingHours || '—') + '</div></div>'
    + '</div>'
    + '</div>'
    + '<div class="desc-box">'
    + '<div class="desc-box-title">'
    + '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
    + 'معرفی'
    + '</div>'
    + '<div class="desc-box-text">' + escapeHtml(e.description || '—') + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="modal-actions-bottom">'
    + '<button class="modal-action-btn call" onclick="callEntity(\'' + (e.phone || '') + '\')">'
    + '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
    + 'تماس'
    + '</button>'
    + '<button class="modal-action-btn share" onclick="shareEntity(\'' + escapeHtml(e.name) + '\')">'
    + '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>'
    + 'اشتراک'
    + '</button>'
    + '</div>';
  
  document.getElementById('infoContent').innerHTML = html;
  openModal('infoModal');
}

/* ==========================================
   View Modal
   ========================================== */
function openView(type, id){
  var e;
  if(type === 'designers'){
    e = DESIGNERS.find(function(d){ return d.id === id; });
  } else {
    e = SHOPS.find(function(s){ return s.id === id; });
  }
  if(!e) return;
  currentViewEntity = e;
  
  if(type === 'designers'){
    currentViewTab = 'products';
    renderDesignerView();
  } else {
    currentShopCat = 'women';
    renderShopView();
  }
  openModal('viewModal');
}

function renderDesignerView(){
  var e = currentViewEntity;
  var html = '<div class="modal-handle"></div>'
    + '<div class="modal-header">'
    + '<div class="modal-title">'
    + '<div class="icon-circle">'
    + '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/></svg>'
    + '</div>'
    + '<span>' + escapeHtml(e.name) + '</span>'
    + '</div>'
    + '<button class="close-x" onclick="closeModal(\'viewModal\')">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="view-tabs">'
    + '<button class="view-tab' + (currentViewTab === 'products' ? ' active' : '') + '" onclick="switchDesignerTab(\'products\')">'
    + '<svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>'
    + 'لباس‌های فروشی'
    + '</button>'
    + '<button class="view-tab' + (currentViewTab === 'album' ? ' active' : '') + '" onclick="switchDesignerTab(\'album\')">'
    + '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>'
    + 'آلبوم سفارش‌ها'
    + '</button>'
    + '</div>'
    + '<div class="view-content" id="viewContentArea">' + renderDesignerContent() + '</div>';
  document.getElementById('viewContent').innerHTML = html;
}

function renderDesignerContent(){
  var e = currentViewEntity;

        + '</div>';

    var html = '<div class="products-grid">';
    for(var i = 0; i < e.products.length; i++){
      var p = e.products[i];
      var badgeClass = p.badge && p.badge.indexOf('٪') > -1 ? 'sale' : '';
      var imgSrc = IMG + '/products/p' + p.id + '.jpg';
      html += '<div class="product-card" onclick="openProductDetail(\'' + escapeHtml(e.name) + '\',\'' + escapeHtml(p.name) + '\',' + p.price + ',' + (p.old||0) + ',\'' + (p.id||'') + '\')">'
        + '<div class="product-img">'
        + '<svg class="ph" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
        + '<img src="' + imgSrc + '" alt="' + escapeHtml(p.name) + '" loading="lazy" onerror="this.style.display=\'none\'">'
        + (p.badge ? '<span class="product-badge ' + badgeClass + '">' + escapeHtml(p.badge) + '</span>' : '')
        + '</div>'
        + '<div class="product-info">'
        + '<div class="product-name">' + escapeHtml(p.name) + '</div>'
        + '<div class="product-price">'
        + '<span class="price-now">' + toPersianDigits(p.price) + '</span>'
        + (p.old ? '<span class="price-old">' + toPersianDigits(p.old) + '</span>' : '')
        + '<span class="price-cur">افغانی</span>'
        + '</div>'
        + '</div>'
        + '</div>';
    }
    html += '</div>';
    return html;
  } else {
    if(!e.album || e.album.length === 0){
      return '<div class="empty" style="padding:30px 20px">'
        + '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>'
        + '<p>آلبومی ثبت نشده</p>'
        + '<span>به‌زودی</span>'
        + '</div>';
    }
    var html2 = '<div class="products-grid">';
    for(var j = 0; j < e.album.length; j++){
      var a = e.album[j];
      var imgSrc2 = IMG + '/designers/p' + e.id + '_' + a.id + '.jpg';
      html2 += '<div class="product-card">'
        + '<div class="product-img">'
        + '<svg class="ph" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>'
        + '<img src="' + imgSrc2 + '" alt="' + escapeHtml(a.title) + '" loading="lazy" onerror="this.style.display=\'none\'">'
        + '</div>'
        + '<div class="product-info">'
        + '<div class="product-name" style="height:auto">' + escapeHtml(a.title) + '</div>'
        + '</div>'
        + '</div>';
    }
    html2 += '</div>';
    return html2;
  }
}

function switchDesignerTab(tab){
  currentViewTab = tab;
  var tabs = document.querySelectorAll('#viewContent .view-tab');
  if(tabs[0]) tabs[0].classList.toggle('active', tab === 'products');
  if(tabs[1]) tabs[1].classList.toggle('active', tab === 'album');
  var content = document.getElementById('viewContentArea');
  if(content) content.innerHTML = renderDesignerContent();
}

function switchShopCat(cat){
  currentShopCat = cat;
  var tabs = document.querySelectorAll('#viewContent .view-tab');
  if(tabs[0]) tabs[0].classList.toggle('active', cat === 'women');
  if(tabs[1]) tabs[1].classList.toggle('active', cat === 'kids');

  if(content) content.innerHTML = renderShopContent();

/* ==========================================
   Product Detail Modal
   ========================================== */
function openProductDetail(shopName, productName, price, oldPrice, productId){
  var sizeOptions = ['S','M','L','XL','XXL'];
  
  var sizesHtml = '';
  for(var i = 0; i < sizeOptions.length; i++){
    sizesHtml += '<button class="size-btn" onclick="selectSize(this)">' + sizeOptions[i] + '</button>';
  }
  
  selectedQty = 1;
  currentProductData = {
    shopName: shopName,
    name: productName,
    price: price,
    id: productId
  };
  
  var imgSrc = productId ? IMG + '/products/p' + productId + '.jpg' : '';
  
  var html = '<div class="modal-handle"></div>'
    + '<div class="product-modal-img">'
    + '<svg class="big" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
    + (imgSrc ? '<img src="' + imgSrc + '" alt="' + escapeHtml(productName) + '" onerror="this.style.display=\'none\'">' : '')
    + '<button class="modal-close" onclick="closeModal(\'productModal\')">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="modal-body">'
    + '<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">' + escapeHtml(shopName) + '</div>'
    + '<div class="modal-name">' + escapeHtml(productName) + '</div>'
    + '<div class="size-row"><div class="size-label">سایز:</div>'
    + '<div class="size-options">' + sizesHtml + '</div></div>'
    + '<div class="qty-box">'
    + '<div class="qty-label">تعداد:</div>'
    + '<div class="qty-ctrl">'
    + '<button class="qty-btn" onclick="changeQty(-1)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>'
    + '<div class="qty-value" id="qtyValue">۱</div>'
    + '<button class="qty-btn" onclick="changeQty(1)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>'
    + '</div>'
    + '</div>'
    + '<div class="price-box">'
    + '<div class="price-box-label">قیمت</div>'
    + '<div class="price-box-value">' + toPersianDigits(price) + ' <span>افغانی</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="modal-actions-bottom">'
    + '<button class="modal-action-btn share" onclick="closeModal(\'productModal\')">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '<button class="modal-action-btn call" onclick="addToCart()">'
    + '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'
    + 'افزودن به سبد'
    + '</button>'
    + '</div>';
  
  document.getElementById('productContent').innerHTML = html;
  openModal('productModal');
}

function addToCart(){
  if(!currentProductData) return;
  var cart = JSON.parse(localStorage.getItem('bazaarcheh_cart') || '[]');
  cart.push({
    id: currentProductData.id,
    name: currentProductData.name,
    shop: currentProductData.shopName,
    price: currentProductData.price,
    qty: selectedQty
  });
  localStorage.setItem('bazaarcheh_cart', JSON.stringify(cart));
  showToast('به سبد خرید اضافه شد', 'success');
  setTimeout(function(){ closeModal('productModal'); }, 500);
}

function changeQty(d){
  selectedQty = Math.max(1, Math.min(20, selectedQty + d));
  var el = document.getElementById('qtyValue');
  if(el) el.textContent = toPersianDigits(selectedQty);
}
function selectSize(el){
  var all = el.parentNode.querySelectorAll('.size-btn');
  for(var i = 0; i < all.length; i++){ all[i].classList.remove('active'); }
  el.classList.add('active');
}

/* ==========================================
   Actions
   ========================================== */
function toggleFav(id, el){
  var i = favorites.indexOf(id);
  if(i > -1){ favorites.splice(i,1); el.classList.remove('active'); }
  else { favorites.push(id); el.classList.add('active'); }
  localStorage.setItem('bazaarcheh_favs', JSON.stringify(favorites));
}

function callEntity(phone){
  if(!phone || phone === '—'){ showToast('شماره موجود نیست', 'error'); return; }
  showToast(phone);
  setTimeout(function(){ location.href = 'tel:' + phone; }, 300);
}

function shareEntity(name){
  var url = location.href;
  if(navigator.share){
    navigator.share({title: name, url: url}).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function(){
      showToast('لینک کپی شد', 'success');
    });
  }
}

function onSearch(v){
  currentSearch = v.trim();
  renderAll();
}

function showError(msg){
  document.getElementById('contentArea').innerHTML =
    '<div class="error-box">'
    + '<div class="error-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div>'
    + '<div class="error-title">خطا در بارگذاری</div>'
    + '<div class="error-text">' + msg + '</div>'
    + '<button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>'
    + '</div>';
}

/* ==========================================
   Init
   ========================================== */
(function init(){
  loadAll()
    .then(function(){
      renderProvinceFilters();
      renderAll();
    })
    .catch(function(err){
      console.error('Load error:', err);
      showError('فایل‌های JSON بارگذاری نشدند.<br>خطا: ' + err.message);
    });
})();
</script>
