<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>لباس | بازارچه</title>
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;
  --border:rgba(212,175,55,0.22);
  --danger:#e74c3c;--success:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:280px;height:280px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:240px;height:240px;background:radial-gradient(circle,rgba(26,90,150,0.65),transparent 70%);bottom:-80px;left:-80px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}

.page{position:relative;z-index:2;min-height:100vh}

/* Top Bar */
.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.92));backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,175,55,0.15);padding:12px 16px}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92);background:var(--gold-soft)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:16px;font-weight:800;text-align:center;color:var(--gold)}

.search-wrap{position:relative}
.search-wrap input{width:100%;height:46px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0 44px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-wrap .si{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.search-wrap .mic{position:absolute;top:50%;left:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}

/* Category Tabs */
.cat-tabs{display:flex;gap:10px;padding:16px;max-width:520px;margin:0 auto}
.cat-tab{flex:1;padding:14px 8px;border-radius:16px;background:var(--card);border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .25s}
.cat-tab:active{transform:scale(0.96)}
.cat-tab.active{border-color:var(--gold);background:linear-gradient(145deg,rgba(212,175,55,0.2),rgba(212,175,55,0.05));box-shadow:0 8px 25px rgba(212,175,55,0.25)}
.cat-tab-icon{width:48px;height:48px;border-radius:14px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;transition:all .3s}
.cat-tab.active .cat-tab-icon{background:linear-gradient(135deg,#f4d03f,#d4af37)}
.cat-tab-icon svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat-tab.active .cat-tab-icon svg{stroke:var(--navy)}
.cat-tab-name{font-size:12px;font-weight:800;color:var(--text)}
.cat-tab.active .cat-tab-name{color:var(--gold)}
.cat-tab-count{font-size:10px;color:var(--text-dim)}
.cat-tab.active .cat-tab-count{color:var(--gold);opacity:0.7}

/* Sub Filters */
.sub-filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;max-width:520px;margin:0 auto;scrollbar-width:none}
.sub-filters::-webkit-scrollbar{display:none}
.sub-chip{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);transition:all .2s}
.sub-chip:active{transform:scale(0.95)}
.sub-chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* Section Head */
.section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;max-width:520px;margin:0 auto}
.section-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title .accent{display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.section-count{font-size:11.5px;color:var(--text-dim)}

/* Products */
.wrap{padding:0 16px 30px;max-width:520px;margin:0 auto}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.product-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s}
.product-card:active{transform:scale(0.97)}
.product-img{position:relative;width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.product-img svg.ph{width:50%;height:50%;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4;position:relative;z-index:0}
.product-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;z-index:2}
html[dir="ltr"] .product-badge{right:auto;left:8px}
.product-badge.sale{background:var(--danger);color:#fff}
.fav-btn{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(10,25,41,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:2}
html[dir="ltr"] .fav-btn{left:auto;right:8px}
.fav-btn:active{transform:scale(0.85)}
.fav-btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.fav-btn.active svg{fill:var(--gold);stroke:var(--gold)}

.product-info{padding:11px}
.product-name{font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:7px;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.product-price{display:flex;align-items:baseline;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.price-now{font-size:14.5px;font-weight:900;color:var(--gold)}
.price-old{font-size:10px;color:var(--text-dim);text-decoration:line-through}
.price-cur{font-size:9px;color:var(--text-dim)}
.product-meta{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-bottom:9px}
.rating{display:flex;align-items:center;gap:3px;color:var(--gold)}
.rating svg{width:11px;height:11px;fill:var(--gold);stroke:none}
.add-btn{width:100%;padding:8px;border-radius:9px;background:var(--gold-soft);border:1.5px solid var(--gold);color:var(--gold);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.add-btn:active{background:var(--gold);color:var(--navy)}
.add-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Loading & Error */
.loading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim)}
.spinner{width:50px;height:50px;border:3px solid rgba(212,175,55,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px}
.error-box{grid-column:1/-1;text-align:center;padding:40px 20px}
.error-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:rgba(231,76,60,0.15);display:flex;align-items:center;justify-content:center}
.error-icon svg{width:36px;height:36px;stroke:var(--danger);fill:none;stroke-width:2}
.error-title{font-size:15px;font-weight:800;color:var(--danger);margin-bottom:8px}
.error-text{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:16px}
.retry-btn{padding:10px 22px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty p{font-size:14px;font-weight:700;color:var(--text)}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,25,41,0.85);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{width:100%;max-width:560px;max-height:90vh;background:linear-gradient(180deg,#132f4c 0%,#0a1929 100%);border-radius:24px 24px 0 0;border-top:1px solid var(--border);overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -20px 60px rgba(0,0,0,0.6);scrollbar-width:none}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:44px;height:4px;border-radius:2px;background:rgba(212,175,55,0.4);margin:10px auto 0}

.modal-hero{position:relative;height:240px;background:linear-gradient(135deg,#1a3a5c,#0d2137);display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.modal-hero svg.big{width:90px;height:90px;stroke:var(--gold);fill:none;stroke-width:1;opacity:0.4;position:relative;z-index:0}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(10,25,41,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:3}
html[dir="ltr"] .modal-close{right:auto;left:14px}
.modal-close:active{transform:scale(0.9)}
.modal-close svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5}

.modal-body{padding:20px}
.modal-name{font-size:20px;font-weight:900;margin-bottom:8px;line-height:1.3}
.modal-desc{font-size:13px;color:var(--text-dim);line-height:1.8;margin-bottom:16px}
.modal-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(212,175,55,0.1)}
.modal-stats span{display:flex;align-items:center;gap:5px}
.modal-stats svg{width:14px;height:14px;fill:var(--gold);stroke:none}
.modal-stats .rating-val{color:var(--gold);font-weight:800}

.size-row{margin-bottom:16px}
.size-label{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:10px}
.size-options{display:flex;gap:8px;flex-wrap:wrap}
.size-btn{min-width:48px;height:44px;padding:0 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);font-size:13px;font-weight:800;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:all .2s}
.size-btn:active{transform:scale(0.95)}
.size-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.color-row{margin-bottom:16px}
.color-options{display:flex;gap:10px;flex-wrap:wrap}
.color-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);transition:all .2s;cursor:pointer;position:relative}
.color-btn:active{transform:scale(0.9)}
.color-btn.active{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}

.qty-box{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qty-label{font-size:12px;color:var(--text-dim);font-weight:700;flex:1}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:4px}
.qty-btn{width:36px;height:36px;border-radius:9px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty-btn:active{transform:scale(0.9);background:var(--gold)}
.qty-btn:active svg{stroke:var(--navy)}
.qty-btn svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2.5}
.qty-value{font-size:16px;font-weight:900;color:var(--text);min-width:32px;text-align:center}

.price-box{display:flex;align-items:center;justify-content:space-between;padding:16px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);border-radius:14px}
.price-box-label{font-size:12px;color:var(--text-dim);font-weight:700}
.price-box-value{font-size:24px;font-weight:900;color:var(--gold)}
.price-box-value span{font-size:12px;color:var(--text-dim);font-weight:600}

.modal-actions-bottom{display:flex;gap:10px;padding:12px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(10,25,41,0.95) 30%);position:sticky;bottom:0;border-top:1px solid rgba(212,175,55,0.1)}
.modal-action-btn{flex:1;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;transition:all .2s}
.modal-action-btn:active{transform:scale(0.97)}
.modal-action-btn svg{width:20px;height:20px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.modal-action-btn.share{width:52px;flex:0 0 52px;background:var(--card);border:1.5px solid var(--border)}
.modal-action-btn.share svg{stroke:var(--gold)}
.modal-action-btn.buy{background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy)}
.modal-action-btn.buy svg{stroke:var(--navy)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:var(--navy);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:800;z-index:400;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,0.45);white-space:nowrap;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="page">

  <div class="top-bar">
    <div class="top-row">
      <button class="icon-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="page-title">لباس</div>
      <button class="icon-btn" onclick="location.href='cart.html'">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="جستجوی لباس..." oninput="onSearch(this.value)">
      <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <svg class="mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
    </div>
  </div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="sub-filters" id="subFilters"></div>

  <div class="section-head">
    <div class="section-title">
      <span class="accent"></span>
      <span id="sectionTitle">لباس</span>
    </div>
    <div class="section-count" id="resultCount">...</div>
  </div>

  <div class="wrap">
    <div class="products" id="productsGrid">
      <div class="loading">
        <div class="spinner"></div>
        <p>در حال بارگذاری محصولات...</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </a>
    <a href="restaurants.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
      <span>رستورانت</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      <span>چت</span>
    </a>
    <a href="shop.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
      <span>فروشگاه</span>
    </a>
  </nav>

</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================
   تنظیمات
   ========================================== */
var CDN_URL = 'https://cdn.jsdelivr.net/gh/kabulbazarstore-ship-it/bazarcheh-data@main';

/* ==========================================
   State
   ========================================== */
var CLOTHES = [];
var CATS = [];
var SUB_FILTERS = {};
var currentCat = 'women';
var currentSub = 'all';
var currentSearch = '';
var favorites = JSON.parse(localStorage.getItem('bazaarcheh_favs') || '[]');
var cart = JSON.parse(localStorage.getItem('bazaarcheh_cart') || '[]');
var currentProduct = null;
var selectedSize = null;
var selectedColor = null;
var selectedQty = 1;

/* ==========================================
   SVG Icons
   ========================================== */
var ICONS = {
  women: '<svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>',
  kids: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>',
  men: '<svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
};

/* ==========================================
   Helpers
   ========================================== */
function toPersianDigits(n){
  var p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g, function(d){ return p[d]; });
}

function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = 'toast'; }, 2400);
}

/* ==========================================
   CDN Loading
   ========================================== */
function loadJSON(path){
  return fetch(CDN_URL + path, {cache: 'default'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + path);
    return r.json();
  });
}

function loadAllData(){
  return Promise.all([
    loadJSON('/data/clothes/women.json'),
    loadJSON('/data/clothes/kids.json'),
    loadJSON('/data/clothes/men.json')
  ]).then(function(results){
    return {women: results[0], kids: results[1], men: results[2]};
  });
}

function applyData(data){
  CLOTHES = [];
  CATS = [];
  SUB_FILTERS = {};

  var sources = [
    {id:'women', data: data.women},
    {id:'kids', data: data.kids},
    {id:'men', data: data.men}
  ];

  for(var i = 0; i < sources.length; i++){
    var s = sources[i];
    if(!s.data) continue;

    var catId = (s.data.category && s.data.category.id) || s.id;
    var catName = (s.data.category && s.data.category.name) || s.id;

    CATS.push({
      id: catId,
      name: catName,
      icon: ICONS[catId] || ICONS.women
    });

    SUB_FILTERS[catId] = s.data.subFilters || [{id:'all', name:'همه'}];

    var prods = s.data.products || [];
    for(var j = 0; j < prods.length; j++){
      var p = prods[j];
      p.cat = catId;
      CLOTHES.push(p);
    }
  }

  renderCatTabs();
  renderSubFilters();
  renderProducts();
}

/* ==========================================
   Render
   ========================================== */
function renderCatTabs(){
  var html = '';
  for(var i = 0; i < CATS.length; i++){
    var c = CATS[i];
    var count = 0;
    for(var j = 0; j < CLOTHES.length; j++){
      if(CLOTHES[j].cat === c.id) count++;
    }
    var active = (currentCat === c.id) ? ' active' : '';
    html += '<div class="cat-tab' + active + '" onclick="selectCat(\'' + c.id + '\')">'
      + '<div class="cat-tab-icon">' + c.icon + '</div>'
      + '<div class="cat-tab-name">' + c.name + '</div>'
      + '<div class="cat-tab-count">' + toPersianDigits(count) + ' محصول</div>'
      + '</div>';
  }
  document.getElementById('catTabs').innerHTML = html;
}

function renderSubFilters(){
  var filters = SUB_FILTERS[currentCat] || [];
  var html = '';
  for(var i = 0; i < filters.length; i++){
    var f = filters[i];
    var active = (currentSub === f.id) ? ' active' : '';
    html += '<button class="sub-chip' + active + '" onclick="selectSub(\'' + f.id + '\')">' + f.name + '</button>';
  }
  document.getElementById('subFilters').innerHTML = html;
}

function getFiltered(){
  var arr = [];
  for(var i = 0; i < CLOTHES.length; i++){
    var p = CLOTHES[i];
    if(p.cat !== currentCat) continue;
    if(currentSub !== 'all' && p.sub !== currentSub) continue;
    if(currentSearch){
      var q = currentSearch.toLowerCase();
      var nm = p.name.toLowerCase().indexOf(q) > -1;
      var dm = (p.desc || '').toLowerCase().indexOf(q) > -1;
      if(!nm && !dm) continue;
    }
    arr.push(p);
  }
  return arr;
}

function getImageUrl(id, cat){
  return CDN_URL + '/images/clothes/' + (cat || currentCat) + '/p' + id + '.jpg';
}

function renderProducts(){
  var grid = document.getElementById('productsGrid');
  var arr = getFiltered();
  var catName = 'زنانه';
  for(var i = 0; i < CATS.length; i++){
    if(CATS[i].id === currentCat){ catName = CATS[i].name; break; }
  }
  document.getElementById('sectionTitle').textContent = 'لباس ' + catName;
  document.getElementById('resultCount').textContent = toPersianDigits(arr.length) + ' محصول';

  if(arr.length === 0){
    grid.innerHTML = '<div class="empty"><p>محصولی یافت نشد</p></div>';
    return;
  }

  var html = '';
  for(var k = 0; k < arr.length; k++){
    var p = arr[k];
    var isFav = favorites.indexOf(p.id) > -1;
    var badgeClass = p.badge && p.badge.indexOf('٪') > -1 ? 'sale' : '';
    var imgUrl = getImageUrl(p.id, p.cat);

    html += '<div class="product-card" onclick="openProduct(' + p.id + ')">'
      + '<div class="product-img">'
      + '<svg class="ph" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
      + '<img src="' + imgUrl + '" onerror="this.style.display=\'none\'" loading="lazy" alt="' + p.name + '">'
      + (p.badge ? '<span class="product-badge ' + badgeClass + '">' + p.badge + '</span>' : '')
      + '<button class="fav-btn' + (isFav ? ' active' : '') + '" onclick="event.stopPropagation();toggleFav(' + p.id + ',this)">'
      + '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
      + '</button>'
      + '</div>'
      + '<div class="product-info">'
      + '<div class="product-name">' + p.name + '</div>'
      + '<div class="product-price">'
      + '<span class="price-now">' + toPersianDigits(p.price) + '</span>'
      + (p.old ? '<span class="price-old">' + toPersianDigits(p.old) + '</span>' : '')
      + '<span class="price-cur">افغانی</span>'
      + '</div>'
      + '<div class="product-meta">'
      + '<span class="rating">'
      + '<svg viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg>'
      + toPersianDigits(p.rating)
      + '</span>'
      + '</div>'
      + '<button class="add-btn" onclick="event.stopPropagation();openProduct(' + p.id + ')">'
      + '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'
      + 'انتخاب سایز'
      + '</button>'
      + '</div>'
      + '</div>';
  }
  grid.innerHTML = html;
}

function showError(message){
  document.getElementById('productsGrid').innerHTML =
    '<div class="error-box">'
    + '<div class="error-icon">'
    + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
    + '</div>'
    + '<div class="error-title">خطا در بارگذاری</div>'
    + '<div class="error-text">' + message + '</div>'
    + '<button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>'
    + '</div>';
}

/* ==========================================
   Interactions
   ========================================== */
function selectCat(id){
  currentCat = id;
  currentSub = 'all';
  renderCatTabs();
  renderSubFilters();
  renderProducts();
}

function selectSub(id){
  currentSub = id;
  renderSubFilters();
  renderProducts();
}

function onSearch(v){
  currentSearch = v.trim();
  renderProducts();
}

function openProduct(id){
  var p = null;
  for(var i = 0; i < CLOTHES.length; i++){
    if(CLOTHES[i].id === id){ p = CLOTHES[i]; break; }
  }
  if(!p) return;
  currentProduct = p;
  selectedSize = null;
  selectedColor = null;
  selectedQty = 1;

  var sizeHtml = '';
  for(var j = 0; j < p.sizes.length; j++){
    sizeHtml += '<button class="size-btn" onclick="selectSize(this,\'' + p.sizes[j] + '\')">' + p.sizes[j] + '</button>';
  }

  var colorHtml = '';
  for(var k = 0; k < p.colors.length; k++){
    colorHtml += '<div class="color-btn" style="background:' + p.colors[k] + '" onclick="selectColor(this,\'' + p.colors[k] + '\')"></div>';
  }

  var imgUrl = getImageUrl(p.id, p.cat);

  var html = '<div class="modal-handle"></div>'
    + '<div class="modal-hero">'
    + '<svg class="big" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
    + '<img src="' + imgUrl + '" onerror="this.style.display=\'none\'" alt="' + p.name + '">'
    + '<button class="modal-close" onclick="closeModal()">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="modal-body">'
    + '<h2 class="modal-name">' + p.name + '</h2>'
    + '<div class="modal-desc">' + p.desc + '</div>'
    + '<div class="modal-stats">'
    + '<span><svg viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg><span class="rating-val">' + toPersianDigits(p.rating) + '</span></span>'
    + '</div>'
    + '<div class="size-row"><div class="size-label">سایز:</div><div class="size-options" id="sizeOptions">' + sizeHtml + '</div></div>'
    + '<div class="color-row"><div class="size-label">رنگ:</div><div class="color-options" id="colorOptions">' + colorHtml + '</div></div>'
    + '<div class="qty-box">'
    + '<div class="qty-label">تعداد:</div>'
    + '<div class="qty-ctrl">'
    + '<button class="qty-btn" onclick="changeQty(-1)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>'
    + '<div class="qty-value" id="qtyValue">۱</div>'
    + '<button class="qty-btn" onclick="changeQty(1)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>'
    + '</div>'
    + '</div>'
    + '<div class="price-box">'
    + '<div class="price-box-label">قیمت نهایی</div>'
    + '<div class="price-box-value" id="finalPrice">' + toPersianDigits(p.price) + ' <span>افغانی</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="modal-actions-bottom">'
    + '<button class="modal-action-btn share" onclick="shareProduct()">'
    + '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>'
    + '</button>'
    + '<button class="modal-action-btn buy" onclick="confirmAdd()">'
    + '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'
    + 'افزودن به سبد'
    + '</button>'
    + '</div>';

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal(){ document.getElementById('modal').classList.remove('show'); }

function selectSize(el, size){
  var all = document.querySelectorAll('#sizeOptions .size-btn');
  for(var i = 0; i < all.length; i++){ all[i].classList.remove('active'); }
  el.classList.add('active');
  selectedSize = size;
}

function selectColor(el, color){
  var all = document.querySelectorAll('#colorOptions .color-btn');
  for(var i = 0; i < all.length; i++){ all[i].classList.remove('active'); }
  el.classList.add('active');
  selectedColor = color;
}

function changeQty(delta){
  selectedQty = selectedQty + delta;
  if(selectedQty < 1) selectedQty = 1;
  if(selectedQty > 20) selectedQty = 20;
  document.getElementById('qtyValue').textContent = toPersianDigits(selectedQty);
  var total = currentProduct.price * selectedQty;
  document.getElementById('finalPrice').innerHTML = toPersianDigits(total) + ' <span>افغانی</span>';
}

function confirmAdd(){
  if(!selectedSize){ showToast('لطفاً سایز را انتخاب کنید', 'error'); return; }
  if(!selectedColor){ showToast('لطفاً رنگ را انتخاب کنید', 'error'); return; }

  var key = currentProduct.id + '_' + selectedSize + '_' + selectedColor;
  var existing = null;
  for(var i = 0; i < cart.length; i++){
    if(cart[i].key === key){ existing = cart[i]; break; }
  }
  if(existing){
    existing.qty += selectedQty;
  } else {
    cart.push({
      key: key,
      id: currentProduct.id,
      name: currentProduct.name,
      price: currentProduct.price,
      size: selectedSize,
      color: selectedColor,
      qty: selectedQty
    });
  }
  localStorage.setItem('bazaarcheh_cart', JSON.stringify(cart));
  showToast('به سبد خرید اضافه شد', 'success');
  closeModal();
}

function toggleFav(id, el){
  var idx = favorites.indexOf(id);
  if(idx > -1){ favorites.splice(idx, 1); el.classList.remove('active'); }
  else { favorites.push(id); el.classList.add('active'); }
  localStorage.setItem('bazaarcheh_favs', JSON.stringify(favorites));
}

function shareProduct(){
  if(!currentProduct) return;
  var url = location.origin + location.pathname + '?id=' + currentProduct.id;
  if(navigator.share){
    navigator.share({title: currentProduct.name, url: url}).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function(){
      showToast('لینک کپی شد', 'success');
    });
  }
}

/* ==========================================
   Init
   ========================================== */
(function init(){
  loadAllData()
    .then(function(data){
      applyData(data);
    })
    .catch(function(err){
      console.error('Load error:', err);
      showError('فایل‌های JSON بارگذاری نشدند.<br>لطفاً مطمئن شوید در GitHub مسیر <b>data/clothes/</b> فایل‌ها آپلود شده‌اند.<br>خطا: ' + err.message);
    });
})();
</script>
