<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>جستجو | بازارچه</title>
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;
  --border:rgba(212,175,55,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input{font-family:inherit}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}

.page{position:relative;z-index:2;min-height:100vh}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.9));backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search-input-wrap{flex:1;position:relative}
.search-input-wrap input{width:100%;height:44px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0 44px 0 40px;color:var(--text);font-size:14px;outline:none}
.search-input-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap .si{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.search-input-wrap .clear-btn{position:absolute;top:50%;left:14px;transform:translateY(-50%);width:20px;height:20px;cursor:pointer;display:none;align-items:center;justify-content:center}
.search-input-wrap .clear-btn.show{display:flex}
.search-input-wrap .clear-btn svg{width:16px;height:16px;stroke:var(--text-dim);fill:none;stroke-width:2}

.wrap{padding:16px;max-width:520px;margin:0 auto}

/* Quick filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer}
.chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* Suggestions */
.suggest-title{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:10px;padding:0 4px}
.suggest-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.suggest-chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--text);cursor:pointer}
.suggest-chip:active{background:var(--gold-soft);border-color:var(--gold)}
.suggest-chip svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2;margin-inline-end:5px;vertical-align:middle}

/* Results */
.results-count{font-size:12px;color:var(--text-dim);margin-bottom:12px;padding:0 4px}
.result-item{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer}
.result-item:active{background:var(--gold-soft);transform:scale(0.98)}
.result-thumb{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.result-thumb svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.5;opacity:0.6}
.result-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.result-name{font-size:14px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-meta{font-size:11.5px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap}
.result-meta .tag{padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-weight:700}
.result-price{font-size:14px;font-weight:900;color:var(--gold);margin-top:4px}

.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty svg{width:60px;height:60px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.5}
.empty p{font-size:14px}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="جستجوی هر چیزی..." autofocus>
      <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <div class="clear-btn" id="clearBtn" onclick="clearSearch()">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="filters">
      <div class="chip active" data-filter="all" onclick="setFilter('all',this)">همه</div>
      <div class="chip" data-filter="product" onclick="setFilter('product',this)">محصولات</div>
      <div class="chip" data-filter="restaurant" onclick="setFilter('restaurant',this)">رستورانت‌ها</div>
      <div class="chip" data-filter="service" onclick="setFilter('service',this)">خدمات</div>
    </div>

    <div id="suggestions">
      <div class="suggest-title">جستجوهای محبوب</div>
      <div class="suggest-list">
        <div class="suggest-chip" onclick="quickSearch('پیراهن')">
          <svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          پیراهن
        </div>
        <div class="suggest-chip" onclick="quickSearch('کباب')">
          <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
          کباب
        </div>
        <div class="suggest-chip" onclick="quickSearch('عطر')">
          <svg viewBox="0 0 24 24"><path d="M10 2h4v3h-4zM8 5h8l2 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9z"/></svg>
          عطر
        </div>
        <div class="suggest-chip" onclick="quickSearch('کتاب')">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          کتاب
        </div>
        <div class="suggest-chip" onclick="quickSearch('آرایشی')">
          <svg viewBox="0 0 24 24"><path d="M9 2h6v4H9zM7 6h10l1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/></svg>
          آرایشی
        </div>
        <div class="suggest-chip" onclick="quickSearch('سفر')">
          <svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          سفر
        </div>
      </div>
    </div>

    <div id="results"></div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </a>
    <a href="restaurants.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
      <span>رستورانت</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      <span>چت</span>
    </a>
    <a href="shop.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
      <span>فروشگاه</span>
    </a>
  </nav>

</div>

<script>
/* ========== Database ========== */
const DATA = [
  // Products
  {id:1, type:'product', name:'پیراهن افغانی گلدوزی‌شده', price:1200, link:'product.html?id=1', keywords:['پیراهن','لباس','افغانی','گلدوزی','زنانه']},
  {id:2, type:'product', name:'رژ لب مات رزگلد', price:450, link:'product.html?id=2', keywords:['رژ','لب','آرایشی','مات','رزگلد']},
  {id:3, type:'product', name:'عطر زنانه گل محمدی', price:850, link:'product.html?id=3', keywords:['عطر','گل','محمدی','زنانه','بوی']},
  {id:4, type:'product', name:'کتاب کلید بهشت', price:250, link:'product.html?id=4', keywords:['کتاب','کلید','بهشت','داستان']},
  {id:5, type:'product', name:'چادر نماز گلدار', price:900, link:'product.html?id=5', keywords:['چادر','نماز','گلدار','زنانه']},
  {id:6, type:'product', name:'کرم مرطوب‌کننده صورت', price:380, link:'product.html?id=6', keywords:['کرم','مرطوب','صورت','پوست','آرایشی']},
  {id:7, type:'product', name:'شال ابریشم هراتی', price:2000, link:'product.html?id=7', keywords:['شال','ابریشم','هرات','زنانه']},
  {id:8, type:'product', name:'کفش زنانه چرم', price:1500, link:'product.html?id=8', keywords:['کفش','زنانه','چرم']},

  // Restaurants
  {id:101, type:'restaurant', name:'رستورانت مهتاب شینواری', link:'restaurant.html?id=1', keywords:['رستورانت','مهتاب','شینواری','کباب','چلو']},
  {id:102, type:'restaurant', name:'منتو خانه هرات', link:'restaurant.html?id=2', keywords:['منتو','هرات','آشک','رستورانت']},
  {id:103, type:'restaurant', name:'بریانی کابل', link:'restaurant.html?id=3', keywords:['بریانی','کابل','چلو','کباب']},
  {id:104, type:'restaurant', name:'پیتزا روم ایتالیایی', link:'restaurant.html?id=4', keywords:['پیتزا','روم','ایتالیایی','فست','فود']},
  {id:105, type:'restaurant', name:'کافه زرین', link:'restaurant.html?id=5', keywords:['کافه','قهوه','دسر','برگر','زرین']},

  // Services / Categories
  {id:201, type:'service', name:'رستورانت‌ها', link:'restaurants.html', keywords:['رستورانت','غذا','خوردن']},
  {id:202, type:'service', name:'لباس', link:'clothes.html', keywords:['لباس','پوشاک','جامه','پیراهن']},
  {id:203, type:'service', name:'آرایشی و بهداشتی', link:'cosmetics.html', keywords:['آرایشی','بهداشتی','کرم','لوازم']},
  {id:204, type:'service', name:'عطریات', link:'perfumes.html', keywords:['عطر','عطریات','بوی','خوشبو']},
  {id:205, type:'service', name:'کیف پول', link:'wallet.html', keywords:['کیف','پول','پرداخت','wallet']},
  {id:206, type:'service', name:'بانک', link:'bank.html', keywords:['بانک','پول','حساب','انتقال']},
  {id:207, type:'service', name:'صرافی', link:'exchange.html', keywords:['صرافی','اسعار','دالر','تومان','ارز']},
  {id:208, type:'service', name:'سلامت بانوان', link:'health.html', keywords:['سلامت','بهداشت','قاعدگی','بارداری']},
  {id:209, type:'service', name:'کتابخانه', link:'library.html', keywords:['کتاب','کتابخانه','داستان','رمان']},
  {id:210, type:'service', name:'آموزش', link:'education.html', keywords:['آموزش','کلاس','درس','یادگیری']},
  {id:211, type:'service', name:'سفر', link:'travel.html', keywords:['سفر','بند','امیر','هوتل','تفریح']}
];

/* ========== State ========== */
let currentFilter = 'all';
let currentQuery = '';

/* ========== Search Logic ========== */
function search(query){
  currentQuery = query.trim().toLowerCase();
  const resultsEl = document.getElementById('results');
  const suggestEl = document.getElementById('suggestions');
  const clearBtn = document.getElementById('clearBtn');

  if(currentQuery.length === 0){
    suggestEl.style.display = 'block';
    resultsEl.innerHTML = '';
    clearBtn.classList.remove('show');
    return;
  }

  clearBtn.classList.add('show');
  suggestEl.style.display = 'none';

  // Filter by type
  let filtered = DATA.filter(item => {
    if(currentFilter !== 'all' && item.type !== currentFilter) return false;
    return true;
  });

  // Search in name + keywords
  const results = filtered.filter(item => {
    const nameMatch = item.name.toLowerCase().includes(currentQuery);
    const keywordMatch = item.keywords.some(k => k.toLowerCase().includes(currentQuery));
    return nameMatch || keywordMatch;
  });

  // Render
  if(results.length === 0){
    resultsEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>چیزی یافت نشد برای «${escapeHtml(query)}»</p>
      </div>
    `;
    return;
  }

  const typeLabels = {product:'محصول', restaurant:'رستورانت', service:'خدمت'};
  const typeIcons = {
    product: '<svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>',
    restaurant: '<svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>',
    service: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };

  resultsEl.innerHTML = `
    <div class="results-count">${results.length} نتیجه یافت شد</div>
    ${results.map(r => `
      <div class="result-item" onclick="location.href='${r.link}'">
        <div class="result-thumb">${typeIcons[r.type]}</div>
        <div class="result-info">
          <div class="result-name">${highlight(r.name, query)}</div>
          <div class="result-meta">
            <span class="tag">${typeLabels[r.type]}</span>
          </div>
          ${r.price ? `<div class="result-price">${r.price.toLocaleString('en-US')} افغانی</div>` : ''}
        </div>
      </div>
    `).join('')}
  `;
}

function highlight(text, query){
  if(!query) return text;
  const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
  return text.replace(regex, '<mark style="background:var(--gold);color:var(--navy);padding:0 2px;border-radius:3px">$1</mark>');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function setFilter(filter, el){
  currentFilter = filter;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  search(currentQuery);
}

function quickSearch(q){
  document.getElementById('searchInput').value = q;
  search(q);
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  currentQuery = '';
  search('');
  document.getElementById('searchInput').focus();
}

/* ========== Input Listener ========== */
document.getElementById('searchInput').addEventListener('input', function(e){
  search(e.target.value);
});

/* ========== Init ========== */
document.getElementById('searchInput').focus();
</script>
</body>
</html>
