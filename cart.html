<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>سبد خرید | بازارچه</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;--gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);--text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;--border:rgba(212,175,55,0.22);--danger:#e74c3c;--success:#2ecc71}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;padding-bottom:120px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:280px;height:280px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:240px;height:240px;background:radial-gradient(circle,rgba(26,90,150,0.65),transparent 70%);bottom:-80px;left:-80px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}

.page{position:relative;z-index:2;min-height:100vh}

/* Top Bar */
.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.92));backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,175,55,0.15);padding:12px 16px;display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0;transition:all .2s}
.icon-btn:active{transform:scale(0.92);background:var(--gold-soft)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:16px;font-weight:800;text-align:center;color:var(--gold)}
.page-title small{display:block;font-size:10.5px;color:var(--text-dim);font-weight:600;margin-top:2px}

/* Wrap */
.wrap{padding:16px;max-width:520px;margin:0 auto}

/* Section */
.section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.section-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title .accent{display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.section-title .icon{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}
.section-count{font-size:11.5px;color:var(--text-dim)}
.section-group{margin-bottom:20px}

/* Cart item */
.cart-item{
  display:flex;gap:12px;padding:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;margin-bottom:10px;
  position:relative;animation:fadeUp .3s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cart-item-img{
  width:80px;height:80px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--navy-3),var(--navy-2));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.cart-item-img svg{width:36px;height:36px;stroke:var(--gold);fill:none;stroke-width:1.5;opacity:0.5}
.cart-item-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.cart-item-name{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cart-item-meta{font-size:11px;color:var(--text-dim);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.meta-tag{background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.2);padding:2px 7px;border-radius:5px;display:flex;align-items:center;gap:3px}
.meta-tag .color-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--border)}
.cart-item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cart-item-price{font-size:14px;font-weight:900;color:var(--gold);white-space:nowrap}
.cart-item-price span{font-size:9.5px;color:var(--text-dim);font-weight:600}

/* Qty control */
.qty-ctrl{display:flex;align-items:center;gap:4px;background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:3px}
.qty-btn{width:28px;height:28px;border-radius:8px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:active{transform:scale(0.9);background:var(--gold)}
.qty-btn:active svg{stroke:var(--navy)}
.qty-btn svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2.5}
.qty-value{font-size:13px;font-weight:900;color:var(--text);min-width:24px;text-align:center}

/* Delete btn */
.delete-btn{
  position:absolute;top:8px;
  width:26px;height:26px;border-radius:50%;
  background:rgba(231,76,60,0.15);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
html[dir="rtl"] .delete-btn{left:8px}
html[dir="ltr"] .delete-btn{right:8px}
.delete-btn:active{background:var(--danger)}
.delete-btn svg{width:13px;height:13px;stroke:var(--danger);fill:none;stroke-width:2.5}
.delete-btn:active svg{stroke:#fff}

/* Restaurant origin badge */
.source-badge{
  position:absolute;bottom:8px;
  background:rgba(212,175,55,0.15);
  border:1px solid rgba(212,175,55,0.3);
  padding:2px 8px;border-radius:6px;
  font-size:9px;font-weight:700;color:var(--gold);
  display:flex;align-items:center;gap:3px;
}
html[dir="rtl"] .source-badge{left:8px}
html[dir="ltr"] .source-badge{right:8px}
.source-badge svg{width:10px;height:10px;stroke:var(--gold);fill:none;stroke-width:2}

/* Empty state */
.empty-box{
  text-align:center;padding:60px 20px;
  animation:fadeUp .5s both;
}
.empty-icon{
  width:120px;height:120px;margin:0 auto 20px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.03));
  border:2px dashed rgba(212,175,55,0.4);
  display:flex;align-items:center;justify-content:center;
  animation:pulse-glow 2.5s ease-in-out infinite;
}
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.3);transform:scale(1)}
  50%{box-shadow:0 0 0 18px rgba(212,175,55,0);transform:scale(1.03)}
}
.empty-icon svg{width:56px;height:56px;stroke:var(--gold);fill:none;stroke-width:1.5}
.empty-title{font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px}
.empty-text{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:22px;padding:0 20px}
.empty-buttons{display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto}
.empty-btn{
  height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:800;transition:all .2s;
}
.empty-btn:active{transform:scale(0.97)}
.empty-btn.primary{background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy);box-shadow:0 8px 22px rgba(212,175,55,0.35)}
.empty-btn.secondary{background:var(--card);border:1.5px solid var(--border);color:var(--gold)}
.empty-btn svg{width:18px;height:18px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.empty-btn.primary svg{stroke:var(--navy)}
.empty-btn.secondary svg{stroke:var(--gold)}

/* Summary */
.summary{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:16px;
  margin-top:12px;animation:fadeUp .4s both;
}
.summary-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;font-size:13px;color:var(--text-dim);
}
.summary-row.total{
  border-top:1px solid rgba(212,175,55,0.15);
  margin-top:8px;padding-top:14px;
  font-size:16px;font-weight:900;color:var(--text);
}
.summary-row.total .val{color:var(--gold);font-size:20px}
.summary-row .val{color:var(--text);font-weight:700}
.summary-row .free{color:var(--success);font-weight:800;font-size:12px}

/* Actions */
.actions-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:linear-gradient(180deg,rgba(10,25,41,0.85) 0%,var(--navy) 40%);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;
}
.total-box{flex:1;min-width:0}
.total-label{font-size:10.5px;color:var(--text-dim);margin-bottom:2px}
.total-value{font-size:18px;font-weight:900;color:var(--gold);display:flex;align-items:baseline;gap:4px}
.total-value span{font-size:11px;font-weight:600;color:var(--text-dim)}
.checkout-btn{
  height:52px;padding:0 24px;border-radius:14px;
  background:linear-gradient(135deg,#f4d03f,#d4af37);
  color:var(--navy);font-size:14px;font-weight:800;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 10px 25px rgba(212,175,55,0.4);
  transition:all .2s;flex-shrink:0;
}
.checkout-btn:active{transform:scale(0.97)}
.checkout-btn svg{width:18px;height:18px;stroke:var(--navy);fill:none;stroke-width:2.5}

/* Clear button */
.clear-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;height:44px;margin-top:10px;
  border-radius:12px;background:rgba(231,76,60,0.1);
  border:1px solid rgba(231,76,60,0.3);
  color:var(--danger);font-size:12.5px;font-weight:700;
  transition:all .2s;
}
.clear-btn:active{background:rgba(231,76,60,0.2)}
.clear-btn svg{width:16px;height:16px;stroke:var(--danger);fill:none;stroke-width:2}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:none;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.bottom-nav.show{display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:var(--navy);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:800;z-index:400;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,0.45);white-space:nowrap;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}

/* Confirm modal */
.confirm-overlay{position:fixed;inset:0;z-index:300;background:rgba(10,25,41,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
.confirm-overlay.show{opacity:1;pointer-events:auto}
.confirm-card{background:linear-gradient(180deg,#132f4c,#0a1929);border:1px solid var(--border);border-radius:20px;padding:26px 22px;max-width:360px;width:100%;text-align:center;transform:scale(0.9);transition:transform .3s cubic-bezier(0.34,1.56,0.64,1)}
.confirm-overlay.show .confirm-card{transform:scale(1)}
.confirm-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:rgba(231,76,60,0.15);display:flex;align-items:center;justify-content:center}
.confirm-icon svg{width:36px;height:36px;stroke:var(--danger);fill:none;stroke-width:2}
.confirm-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:8px}
.confirm-text{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:20px}
.confirm-actions{display:flex;gap:10px}
.confirm-btn{flex:1;height:48px;border-radius:12px;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.confirm-btn.cancel{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.confirm-btn.confirm{background:var(--danger);color:#fff}
.confirm-btn:active{transform:scale(0.97)}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="page-title">
      سبد خرید
      <small id="itemCountText">۰ آیتم</small>
    </div>
    <button class="icon-btn" onclick="confirmClear()">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="wrap" id="cartContent">
    <!-- Filled by JS -->
  </div>

</div>

<!-- Actions Bar (fixed) -->
<div class="actions-bar" id="actionsBar" style="display:none">
  <div class="total-box">
    <div class="total-label">جمع کل</div>
    <div class="total-value" id="totalValue">۰ <span>افغانی</span></div>
  </div>
  <button class="checkout-btn" onclick="checkout()">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    پرداخت
  </button>
</div>

<!-- Bottom Nav (for empty state) -->
<nav class="bottom-nav" id="bottomNav">
  <a href="home.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>خانه</span>
  </a>
  <a href="restaurants.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
    <span>رستورانت</span>
  </a>
  <a href="chat.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
    <span>چت</span>
  </a>
  <a href="clothes.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
    <span>لباس</span>
  </a>
</nav>

<!-- Confirm Modal -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-card">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </div>
    <div class="confirm-title">پاک کردن سبد خرید</div>
    <div class="confirm-text">آیا مطمئن هستید که می‌خواهید همه آیتم‌های سبد خرید را پاک کنید؟</div>
    <div class="confirm-actions">
      <button class="confirm-btn cancel" onclick="closeConfirm()">انصراف</button>
      <button class="confirm-btn confirm" onclick="doClear()">پاک کردن</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================
   State
   ========================================== */
var cart = [];
var SHIPPING_FEE = 50;
var FREE_SHIPPING_MIN = 1000;

/* ==========================================
   Helpers
   ========================================== */
function toPersianDigits(n){
  var p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g, function(d){ return p[d]; });
}
function formatPrice(p){
  return toPersianDigits(Number(p).toLocaleString('en-US'));
}
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = 'toast'; }, 2400);
}
function goBack(){
  if(history.length > 1) history.back();
  else location.href = 'home.html';
}

/* ==========================================
   Load Cart from localStorage
   ========================================== */
function loadCart(){
  try {
    cart = JSON.parse(localStorage.getItem('bazaarcheh_cart') || '[]');
    if(!Array.isArray(cart)) cart = [];
  } catch(e){ cart = []; }
}

function saveCart(){
  try {
    localStorage.setItem('bazaarcheh_cart', JSON.stringify(cart));
  } catch(e){}
}

/* ==========================================
   Detect item type
   ========================================== */
function getItemType(item){
  if(item.restId || item.restName) return 'restaurant';
  if(item.size || item.color) return 'clothes';
  return 'product';
}

/* ==========================================
   Render
   ========================================== */
function render(){
  loadCart();
  var content = document.getElementById('cartContent');
  var actionsBar = document.getElementById('actionsBar');
  var bottomNav = document.getElementById('bottomNav');
  var itemCountText = document.getElementById('itemCountText');

  var totalItems = 0;
  for(var i = 0; i < cart.length; i++){
    totalItems += cart[i].qty || 1;
  }

  itemCountText.textContent = toPersianDigits(totalItems) + ' آیتم';

  if(cart.length === 0){
    actionsBar.style.display = 'none';
    bottomNav.classList.add('show');
    content.innerHTML = renderEmpty();
    return;
  }

  actionsBar.style.display = 'flex';
  bottomNav.classList.remove('show');

  // گروه‌بندی: لباس + رستورانت
  var clothesItems = [];
  var restaurantItems = [];
  var otherItems = [];

  for(var j = 0; j < cart.length; j++){
    var type = getItemType(cart[j]);
    if(type === 'clothes') clothesItems.push(cart[j]);
    else if(type === 'restaurant') restaurantItems.push(cart[j]);
    else otherItems.push(cart[j]);
  }

  var html = '';

  if(clothesItems.length > 0){
    html += '<div class="section-group">'
      + '<div class="section-head">'
      + '<div class="section-title">'
      + '<span class="accent"></span>'
      + '<svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
      + '<span>لباس و پوشاک</span>'
      + '</div>'
      + '<div class="section-count">' + toPersianDigits(clothesItems.length) + ' آیتم</div>'
      + '</div>';
    for(var k = 0; k < clothesItems.length; k++){
      html += renderItem(clothesItems[k], 'clothes');
    }
    html += '</div>';
  }

  if(restaurantItems.length > 0){
    html += '<div class="section-group">'
      + '<div class="section-head">'
      + '<div class="section-title">'
      + '<span class="accent"></span>'
      + '<svg class="icon" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>'
      + '<span>رستورانت</span>'
      + '</div>'
      + '<div class="section-count">' + toPersianDigits(restaurantItems.length) + ' آیتم</div>'
      + '</div>';
    for(var m = 0; m < restaurantItems.length; m++){
      html += renderItem(restaurantItems[m], 'restaurant');
    }
    html += '</div>';
  }

  if(otherItems.length > 0){
    html += '<div class="section-group">'
      + '<div class="section-head">'
      + '<div class="section-title">'
      + '<span class="accent"></span>'
      + '<svg class="icon" viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>'
      + '<span>سایر محصولات</span>'
      + '</div>'
      + '<div class="section-count">' + toPersianDigits(otherItems.length) + ' آیتم</div>'
      + '</div>';
    for(var n = 0; n < otherItems.length; n++){
      html += renderItem(otherItems[n], 'product');
    }
    html += '</div>';
  }

  // Summary
  var subtotal = 0;
  for(var s = 0; s < cart.length; s++){
    subtotal += (cart[s].price || 0) * (cart[s].qty || 1);
  }
  var shipping = (subtotal >= FREE_SHIPPING_MIN || subtotal === 0) ? 0 : SHIPPING_FEE;
  var total = subtotal + shipping;

  html += '<div class="summary">'
    + '<div class="summary-row">'
    + '<span>جمع محصولات</span>'
    + '<span class="val">' + formatPrice(subtotal) + ' افغانی</span>'
    + '</div>'
    + '<div class="summary-row">'
    + '<span>هزینه ارسال</span>'
    + (shipping === 0
        ? '<span class="free">رایگان</span>'
        : '<span class="val">' + formatPrice(shipping) + ' افغانی</span>')
    + '</div>'
    + '<div class="summary-row total">'
    + '<span>جمع کل</span>'
    + '<span class="val">' + formatPrice(total) + ' افغانی</span>'
    + '</div>'
    + '</div>';

  // Clear button
  html += '<button class="clear-btn" onclick="confirmClear()">'
    + '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>'
    + 'پاک کردن کل سبد خرید'
    + '</button>';

  content.innerHTML = html;

  // Update actions bar total
  document.getElementById('totalValue').innerHTML =
    formatPrice(total) + ' <span>افغانی</span>';
}

function renderEmpty(){
  return '<div class="empty-box">'
    + '<div class="empty-icon">'
    + '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'
    + '</div>'
    + '<div class="empty-title">سبد خرید خالی است</div>'
    + '<div class="empty-text">هنوز چیزی به سبد خرید اضافه نکرده‌اید. از بخش‌های زیر شروع کنید.</div>'
    + '<div class="empty-buttons">'
    + '<a href="clothes.html" class="empty-btn primary">'
    + '<svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
    + 'رفتن به لباس‌ها'
    + '</a>'
    + '<a href="restaurants.html" class="empty-btn secondary">'
    + '<svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>'
    + 'رفتن به رستورانت‌ها'
    + '</a>'
    + '</div>'
    + '</div>';
}

function renderItem(item, type){
  var qty = item.qty || 1;
  var itemKey = item.key || (item.id + '_' + (item.size || '') + '_' + (item.color || ''));

  var metaHtml = '';
  if(type === 'clothes'){
    if(item.size){
      metaHtml += '<span class="meta-tag">سایز: ' + item.size + '</span>';
    }
    if(item.color){
      metaHtml += '<span class="meta-tag">'
        + '<span class="color-dot" style="background:' + item.color + '"></span>'
        + '</span>';
    }
  } else if(type === 'restaurant'){
    if(item.restName){
      metaHtml += '<span class="meta-tag">'
        + '<svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:var(--gold);fill:none;stroke-width:2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>'
        + item.restName
        + '</span>';
    }
  }

  var sourceBadge = '';
  if(type === 'clothes' && item.shopName){
    sourceBadge = '<div class="source-badge">'
      + '<svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
      + item.shopName
      + '</div>';
  } else if(type === 'restaurant' && item.restName){
    sourceBadge = '<div class="source-badge">'
      + '<svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>'
      + item.restName
      + '</div>';
  }

  return '<div class="cart-item">'
    + '<button class="delete-btn" onclick="removeItem(\'' + itemKey + '\')">'
    + '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    + '</button>'
    + '<div class="cart-item-img">'
    + '<svg viewBox="0 0 24 24">'
    + (type === 'restaurant'
        ? '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/>'
        : '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>')
    + '</svg>'
    + '</div>'
    + '<div class="cart-item-info">'
    + '<div>'
    + '<div class="cart-item-name">' + item.name + '</div>'
    + (metaHtml ? '<div class="cart-item-meta">' + metaHtml + '</div>' : '<div style="height:8px"></div>')
    + '</div>'
    + '<div class="cart-item-bottom">'
    + '<div class="cart-item-price">' + formatPrice(item.price * qty) + ' <span>افغانی</span></div>'
    + '<div class="qty-ctrl">'
    + '<button class="qty-btn" onclick="changeQty(\'' + itemKey + '\', -1)">'
    + '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>'
    + '</button>'
    + '<div class="qty-value">' + toPersianDigits(qty) + '</div>'
    + '<button class="qty-btn" onclick="changeQty(\'' + itemKey + '\', 1)">'
    + '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
    + '</button>'
    + '</div>'
    + '</div>'
    + '</div>'
    + sourceBadge
    + '</div>';
}

/* ==========================================
   Actions
   ========================================== */
function getKey(item){
  return item.key || (item.id + '_' + (item.size || '') + '_' + (item.color || ''));
}

function changeQty(key, delta){
  for(var i = 0; i < cart.length; i++){
    if(getKey(cart[i]) === key){
      cart[i].qty = (cart[i].qty || 1) + delta;
      if(cart[i].qty < 1){
        cart.splice(i, 1);
        showToast('آیتم حذف شد', 'error');
      }
      saveCart();
      render();
      return;
    }
  }
}

function removeItem(key){
  for(var i = 0; i < cart.length; i++){
    if(getKey(cart[i]) === key){
      cart.splice(i, 1);
      saveCart();
      showToast('آیتم حذف شد', 'error');
      render();
      return;
    }
  }
}

/* ==========================================
   Clear cart
   ========================================== */
function confirmClear(){
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('show');
}
function doClear(){
  cart = [];
  saveCart();
  closeConfirm();
  showToast('سبد خرید پاک شد', 'success');
  render();
}

/* ==========================================
   Checkout
   ========================================== */
function checkout(){
  loadCart();
  if(cart.length === 0){
    showToast('سبد خرید خالی است', 'error');
    return;
  }

  // محاسبه جمع کل
  var subtotal = 0;
  for(var i = 0; i < cart.length; i++){
    subtotal += (cart[i].price || 0) * (cart[i].qty || 1);
  }
  var shipping = subtotal >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FEE;
  var total = subtotal + shipping;

  // ذخیره‌ی اطلاعات پرداخت
  var order = {
    items: cart.slice(),
    subtotal: subtotal,
    shipping: shipping,
    total: total,
    date: new Date().toISOString(),
    status: 'pending'
  };
  try {
    localStorage.setItem('bazaarcheh_pending_order', JSON.stringify(order));
  } catch(e){}

  // رفتن به صفحه پرداخت
  location.href = 'checkout.html';
}

/* ==========================================
   Init
   ========================================== */
render();

/* چک تغییرات localStorage از تب‌های دیگه */
window.addEventListener('storage', function(e){
  if(e.key === 'bazaarcheh_cart'){
    render();
  }
});

/* وقتی برمی‌گردیم به این صفحه */
window.addEventListener('pageshow', function(){
  render();
});
</script>
