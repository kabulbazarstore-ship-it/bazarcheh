<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>اعلان‌ها | بازارچه</title>
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;
  --border:rgba(212,175,55,0.22);
  --danger:#e74c3c;--success:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:100px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}

.page{position:relative;z-index:2;min-height:100vh}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.9));backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:15px;font-weight:700;text-align:center;color:var(--gold)}

.wrap{padding:16px;max-width:520px;margin:0 auto}

.notif-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.notif-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer}
.tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.notif-list{display:flex;flex-direction:column;gap:10px}

.notif-item{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;position:relative;transition:all .2s}
.notif-item:active{background:var(--gold-soft);transform:scale(0.98)}
.notif-item.unread{border-inline-start:3px solid var(--gold)}
.notif-item.unread::after{content:'';position:absolute;top:14px;left:14px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
html[dir="ltr"] .notif-item.unread::after{left:auto;right:14px}

.notif-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-icon svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2}
.notif-icon.success{background:rgba(46,204,113,0.15)}
.notif-icon.success svg{stroke:var(--success)}
.notif-icon.danger{background:rgba(231,76,60,0.15)}
.notif-icon.danger svg{stroke:var(--danger)}

.notif-body{flex:1;min-width:0}
.notif-title{font-size:13.5px;font-weight:700;margin-bottom:4px;line-height:1.4}
.notif-text{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:6px}
.notif-time{font-size:10.5px;color:var(--text-dim);opacity:0.7}

.empty{text-align:center;padding:80px 20px;color:var(--text-dim)}
.empty svg{width:70px;height:70px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.4}
.empty p{font-size:14px;margin-bottom:6px}
.empty span{font-size:12px;opacity:0.7}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:8px;left:12px;right:12px;z-index:60;background:rgba(19,47,76,0.55);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(212,175,55,0.2);box-shadow:0 -8px 32px rgba(0,0,0,0.4);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;position:relative}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="page-title">اعلان‌ها</div>
    <button class="icon-btn" onclick="markAllRead()" title="همه خوانده شد">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="notif-tabs">
      <div class="tab active" onclick="setTab('all',this)">همه</div>
      <div class="tab" onclick="setTab('order',this)">سفارشات</div>
      <div class="tab" onclick="setTab('promo',this)">پیشنهادها</div>
      <div class="tab" onclick="setTab('system',this)">سیستم</div>
    </div>

    <div class="notif-list" id="notifList"></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </a>
    <a href="restaurants.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
      <span>رستورانت</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      <span>چت</span>
    </a>
    <a href="shop.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
      <span>فروشگاه</span>
    </a>
  </nav>

</div>

<script>
const NOTIFS = [
  {id:1, type:'order', title:'سفارش شما ارسال شد', text:'سفارش #1234 از رستورانت مهتاب شینواری در راه است', time:'۲ دقیقه پیش', icon:'success', unread:true},
  {id:2, type:'promo', title:'تخفیف ویژه امشب!', text:'۴۰٪ تخفیف روی عطرهای زنانه — تا ۲ ساعت دیگر', time:'۳۰ دقیقه پیش', icon:'gold', unread:true},
  {id:3, type:'system', title:'خوش آمدید به بازارچه', text:'حساب شما با موفقیت ساخته شد', time:'۱ ساعت پیش', icon:'success', unread:false},
  {id:4, type:'order', title:'سفارش شما تایید شد', text:'سفارش #1233 تایید شد و در حال آماده‌سازی است', time:'۲ ساعت پیش', icon:'gold', unread:false},
  {id:5, type:'promo', title:'ارسال رایگان امروز', text:'برای خریدهای بالای ۱۰۰۰ افغانی، ارسال رایگان', time:'دیروز', icon:'gold', unread:false},
  {id:6, type:'system', title:'بروزرسانی اپلیکیشن', text:'نسخه جدید بازارچه با امکانات بیشتر', time:'۲ روز پیش', icon:'gold', unread:false}
];

let currentTab = 'all';
let readIds = JSON.parse(localStorage.getItem('bazaarcheh_read_notifs') || '[]');

function setTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getIconClass(type){
  if(type === 'order') return 'success';
  if(type === 'system') return 'success';
  return '';
}

function getIcon(type){
  if(type === 'order'){
    return '<svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>';
  }
  if(type === 'promo'){
    return '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
}

function render(){
  const list = document.getElementById('notifList');
  const filtered = currentTab === 'all' ? NOTIFS : NOTIFS.filter(n => n.type === currentTab);

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <p>هیچ اعلانی نیست</p>
        <span>وقتی پیام جدید بیاد، اینجا نشون داده می‌شه</span>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(n => {
    const isRead = readIds.includes(n.id);
    return `
      <div class="notif-item ${isRead?'':'unread'}" onclick="openNotif(${n.id})">
        <div class="notif-icon ${getIconClass(n.type)}">
          ${getIcon(n.type)}
        </div>
        <div class="notif-body">
          <div class="notif-title">${n.title}</div>
          <div class="notif-text">${n.text}</div>
          <div class="notif-time">${n.time}</div>
        </div>
      </div>
    `;
  }).join('');
}

function openNotif(id){
  if(!readIds.includes(id)){
    readIds.push(id);
    localStorage.setItem('bazaarcheh_read_notifs', JSON.stringify(readIds));
  }
  render();
}

function markAllRead(){
  readIds = NOTIFS.map(n => n.id);
  localStorage.setItem('bazaarcheh_read_notifs', JSON.stringify(readIds));
  render();
}

render();
</script>
</body>
</html>
