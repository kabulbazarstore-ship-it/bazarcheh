<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>فروشگاه | بانوان</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --navy:#0a1929;
  --navy-2:#102a43;
  --navy-3:#1a3a5c;
  --gold:#d4af37;
  --gold-2:#f4d03f;
  --gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;
  --text-dim:#8ba3bd;
  --card:#132f4c;
  --border:rgba(212,175,55,0.2);
  --danger:#e74c3c;
  --success:#2ecc71;
  --radius:14px;
  --shadow:0 4px 20px rgba(0,0,0,0.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:var(--navy);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
}
html[dir="ltr"] body{font-family:'Segoe UI',Arial,sans-serif}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select{font-family:inherit}

/* ===== Header ===== */
.top-bar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,var(--navy) 0%,rgba(10,25,41,0.95) 100%);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);
  transition:all .2s;flex-shrink:0;
}
.icon-btn:active{transform:scale(0.92);background:var(--gold-soft)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input-wrap{
  flex:1;position:relative;
}
.search-input-wrap input{
  width:100%;height:42px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 44px 0 14px;
  color:var(--text);font-size:14px;outline:none;
  transition:border .2s;
}
html[dir="ltr"] .search-input-wrap input{padding:0 14px 0 44px}
.search-input-wrap input:focus{border-color:var(--gold)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap svg{
  position:absolute;top:50%;right:14px;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;
}
html[dir="ltr"] .search-input-wrap svg{right:auto;left:14px}

/* ===== Lang switcher ===== */
.lang-pills{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:10px;border:1px solid var(--border)}
.lang-pills button{
  padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-dim);
  transition:all .2s;
}
.lang-pills button.active{background:var(--gold);color:var(--navy)}

/* ===== Category chips ===== */
.cat-scroll{
  display:flex;gap:10px;overflow-x:auto;padding:14px 16px;
  scrollbar-width:none;
}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:12px;
  background:var(--card);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;transition:all .2s;
}
.cat-chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.cat-chip:active{transform:scale(0.95)}
.cat-chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Filter bar ===== */
.filter-bar{
  display:flex;gap:10px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;
  padding:8px 14px;border-radius:10px;
  background:transparent;border:1px solid var(--border);
  font-size:12px;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;
}
.filter-btn.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.filter-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ===== Products grid ===== */
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px 12px;
}
.section-title h2{font-size:16px;font-weight:700}
.section-title span{font-size:12px;color:var(--gold)}

.products{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  padding:0 16px 100px;
}
.product-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .2s;
  position:relative;
}
.product-card:active{transform:scale(0.97)}
.product-img{
  position:relative;width:100%;aspect-ratio:1/1;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-3));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-img .placeholder{
  width:50%;height:50%;opacity:0.4;
}
.product-badge{
  position:absolute;top:8px;
  background:var(--gold);color:var(--navy);
  font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:6px;
}
html[dir="rtl"] .product-badge{right:8px}
html[dir="ltr"] .product-badge{left:8px}
.product-badge.sale{background:var(--danger);color:#fff}
.fav-btn{
  position:absolute;top:8px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(10,25,41,0.7);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
html[dir="rtl"] .fav-btn{left:8px}
html[dir="ltr"] .fav-btn{right:8px}
.fav-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.fav-btn.active svg{fill:var(--gold);stroke:var(--gold)}
.product-info{padding:10px}
.product-name{
  font-size:13px;font-weight:600;line-height:1.4;
  margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:36px;
}
.product-price{
  display:flex;align-items:baseline;gap:6px;margin-bottom:8px;
}
.price-now{font-size:15px;font-weight:800;color:var(--gold)}
.price-old{font-size:11px;color:var(--text-dim);text-decoration:line-through}
.price-cur{font-size:10px;color:var(--text-dim)}
.product-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--text-dim);margin-bottom:8px;
}
.rating{display:flex;align-items:center;gap:3px;color:var(--gold)}
.rating svg{width:12px;height:12px;fill:var(--gold);stroke:none}
.add-btn{
  width:100%;padding:8px;border-radius:10px;
  background:var(--gold-soft);border:1px solid var(--gold);
  color:var(--gold);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all .2s;
}
.add-btn:active{background:var(--gold);color:var(--navy)}
.add-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}

/* ===== Bottom nav ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:linear-gradient(180deg,rgba(10,25,41,0.95),var(--navy));
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--text-dim);font-size:10px;font-weight:600;
  transition:color .2s;position:relative;
}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--gold)}
.nav-item.active::before{
  content:'';position:absolute;top:-8px;width:24px;height:3px;
  background:var(--gold);border-radius:0 0 4px 4px;
}
.nav-badge{
  position:absolute;top:2px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:9px;font-weight:700;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
}
html[dir="rtl"] .nav-badge{left:calc(50% + 6px)}
html[dir="ltr"] .nav-badge{right:calc(50% + 6px)}

/* ===== Empty state ===== */
.empty{
  grid-column:1/-1;
  padding:60px 20px;text-align:center;color:var(--text-dim);
}
.empty svg{width:60px;height:60px;stroke:var(--text-dim);fill:none;stroke-width:1.5;margin:0 auto 16px;opacity:0.5}
.empty p{font-size:14px}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--gold);color:var(--navy);
  padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;
  z-index:100;transition:transform .3s;box-shadow:var(--shadow);
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
/* ========== Translations ========== */
const T = {
  fa:{
    home:'خانه',shop:'فروشگاه',chat:'چت',profile:'پروفایل',
    search:'جستجو در فروشگاه...',allProducts:'همه محصولات',
    productsCount:'کالا',addToCart:'افزودن',added:'به سبد اضافه شد',
    favAdded:'به علاقه‌مندی اضافه شد',noResults:'محصولی یافت نشد',
    catNames:{all:'همه',clothes:'لباس',cosmetics:'آرایشی',perfumes:'عطر',
              restaurants:'رستورانت',health:'سلامت',library:'کتاب',travel:'سفر'},
    filters:{new:'جدیدترین',popular:'محبوب',cheap:'ارزان‌ترین',
             expensive:'گران‌ترین',discount:'تخفیف‌دار'}
  },
  ps:{
    home:'کور',shop:'پلورنځی',chat:'چټ',profile:'پروفایل',
    search:'په پلورنځي کې پلټنه...',allProducts:'ټول محصولات',
    productsCount:'توکي',addToCart:'زیاتول',added:'سبد ته اضافه شو',
    favAdded:'خوښ شو',noResults:'هیڅ محصول ونه موندل شو',
    catNames:{all:'ټول',clothes:'جامې',cosmetics:'کاسمیټیک',perfumes:'عطر',
              restaurants:'رستورانت',health:'روغتیا',library:'کتاب',travel:'سفر'},
    filters:{new:'نوي',popular:'مشهور',cheap:'ارزانه',
             expensive:'ګران',discount:'تخفیف'}
  },
  en:{
    home:'Home',shop:'Shop',chat:'Chat',profile:'Profile',
    search:'Search products...',allProducts:'All Products',
    productsCount:'items',addToCart:'Add',added:'Added to cart',
    favAdded:'Added to favorites',noResults:'No products found',
    catNames:{all:'All',clothes:'Clothes',cosmetics:'Cosmetics',perfumes:'Perfumes',
              restaurants:'Restaurants',health:'Health',library:'Books',travel:'Travel'},
    filters:{new:'Newest',popular:'Popular',cheap:'Cheapest',
             expensive:'Expensive',discount:'On Sale'}
  }
};

/* ========== State ========== */
let currentLang = localStorage.getItem('banovan_lang') || 'fa';
let currentCat = 'all';
let currentFilter = 'new';
let currentSearch = '';
let favorites = JSON.parse(localStorage.getItem('banovan_favs') || '[]');
let cart = JSON.parse(localStorage.getItem('banovan_cart') || '[]');

/* ========== Sample Products (demo data) ========== */
const PRODUCTS = [

  {id:5, name:'چادر نماز گلدار', cat:'clothes', price:900, old:1200, rating:4.6, img:'', badge:'-25%'},
  {id:6, name:'کرم مرطوب‌کننده صورت', cat:'cosmetics', price:380, old:0, rating:4.5, img:'', badge:''},
  {id:7, name:'قابلمه چدنی', cat:'restaurants', price:1500, old:2000, rating:4.4, img:'', badge:'-25%'},
  {id:8, name:'پماد گیاهی زخم', cat:'health', price:300, old:0, rating:4.8, img:'', badge:''},
  {id:9, name:'شال ابریشم هراتی', cat:'clothes', price:2000, old:2600, rating:4.9, img:'', badge:'-23%'},
  {id:10, name:'عطر مردانه عود', cat:'perfumes', price:1100, old:0, rating:4.7, img:'', badge:''},
  {id:11, name:'چادر رنگی کوکی', cat:'clothes', price:700, old:0, rating:4.3, img:'', badge:'جدید'},
  {id:12, name:'کتاب داستان‌های افغانی', cat:'library', price:400, old:550, rating:4.6, img:'', badge:'-27%'}
];

/* ========== Helpers ========== */
function toPersianDigits(n){
  if(currentLang==='en') return String(n);
  const p = currentLang==='ps' ? ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹']
                                : ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g,d=>p[d]);
}
function formatPrice(p){
  return toPersianDigits(p.toLocaleString('en-US'));
}
function t(key){ return T[currentLang][key] || T.fa[key]; }

/* ========== Render ========== */
function getFilteredProducts(){
  let arr = PRODUCTS.filter(p => {
    if(currentCat !== 'all' && p.cat !== currentCat) return false;
    if(currentSearch && !p.name.toLowerCase().includes(currentSearch.toLowerCase())) return false;
    return true;
  });
  if(currentFilter==='cheap') arr.sort((a,b)=>a.price-b.price);
  else if(currentFilter==='expensive') arr.sort((a,b)=>b.price-a.price);
  else if(currentFilter==='popular') arr.sort((a,b)=>b.rating-a.rating);
  else if(currentFilter==='discount') arr = arr.filter(p=>p.old>0);
  else arr.sort((a,b)=>b.id-a.id);
  return arr;
}

function renderProducts(){
  const grid = document.getElementById('productsGrid');
  const arr = getFilteredProducts();
  document.getElementById('countText').textContent =
    toPersianDigits(arr.length) + ' ' + t('productsCount');
  document.getElementById('sectionTitle').textContent =
    currentCat==='all' ? t('allProducts') : T[currentLang].catNames[currentCat];

  if(arr.length===0){
    grid.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>${t('noResults')}</p>
    </div>`;
    return;
  }

  grid.innerHTML = arr.map(p=>`
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="product-img">
        <svg class="placeholder" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        ${p.badge?`<span class="product-badge ${p.badge.includes('-')?'sale':''}">${p.badge}</span>`:''}
        <button class="fav-btn ${favorites.includes(p.id)?'active':''}" onclick="event.stopPropagation();toggleFav(${p.id},this)">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">
          <span class="price-now">${formatPrice(p.price)}</span>
          ${p.old>0?`<span class="price-old">${formatPrice(p.old)}</span>`:''}
          <span class="price-cur">افغانی</span>
        </div>
        <div class="product-meta">
          <span class="rating">
            <svg viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg>
            ${toPersianDigits(p.rating)}
          </span>
        </div>
        <button class="add-btn" onclick="event.stopPropagation();addToCart(${p.id})">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          ${t('addToCart')}
        </button>
      </div>
    </div>
  `).join('');
}

/* ========== Actions ========== */
function selectCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderProducts();
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderProducts();
}

function handleSearch(e){
  currentSearch = e.target.value.trim();
  renderProducts();
}

function toggleFav(id, el){
  const i = favorites.indexOf(id);
  if(i>-1){ favorites.splice(i,1); el.classList.remove('active'); }
  else { favorites.push(id); el.classList.add('active'); showToast(t('favAdded')); }
  localStorage.setItem('banovan_favs', JSON.stringify(favorites));
}

function addToCart(id){
  const item = cart.find(c=>c.id===id);
  if(item) item.qty++;
  else cart.push({id, qty:1});
  localStorage.setItem('banovan_cart', JSON.stringify(cart));
  showToast(t('added'));
}

function openProduct(id){
  location.href = 'product.html?id=' + id;
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ========== Language ========== */
function setLang(lang){
  currentLang = lang;
  localStorage.setItem('banovan_lang', lang);
  const html = document.documentElement;
  html.lang = lang==='en' ? 'en' : 'fa';
  html.dir = lang==='en' ? 'ltr' : 'rtl';

  document.querySelectorAll('.lang-pills button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });

  document.getElementById('searchInput').placeholder = t('search');

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });

  // Translate filter buttons
  const filterKeys = ['new','popular','cheap','expensive','discount'];
  document.querySelectorAll('.filter-btn').forEach((b,i)=>{
    const svg = b.querySelector('svg').outerHTML;
    b.innerHTML = svg + ' ' + T[lang].filters[filterKeys[i]];
  });

  // Translate category chips
  const catKeys = ['all','clothes','cosmetics','perfumes','restaurants','health','library','travel'];
  document.querySelectorAll('.cat-chip').forEach((c,i)=>{
    const svg = c.querySelector('svg').outerHTML;
    c.innerHTML = svg + ' ' + T[lang].catNames[catKeys[i]];
  });

  renderProducts();
}

/* ========== Init ========== */
(function init(){
  const lang = currentLang;
  document.documentElement.lang = lang==='en'?'en':'fa';
  document.documentElement.dir = lang==='en'?'ltr':'rtl';
  document.querySelectorAll('.lang-pills button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
  document.getElementById('searchInput').placeholder = t('search');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  renderProducts();
})();
</script>
</body>
</html>
