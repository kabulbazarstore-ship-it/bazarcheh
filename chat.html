<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>چت | بازارچه</title>
<style>
:root{
  --navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;
  --gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);
  --text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;
  --border:rgba(212,175,55,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.1) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:280px;height:280px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-90px;right:-90px}
.orb.o2{width:240px;height:240px;background:radial-gradient(circle,rgba(26,90,150,0.65),transparent 70%);bottom:-80px;left:-80px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}

.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}

.top-bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,25,41,0.98),rgba(10,25,41,0.9));backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.icon-btn:active{transform:scale(0.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:15px;font-weight:700;text-align:center;color:var(--gold)}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}

.empty-box{text-align:center;max-width:360px;animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.icon-big{
  width:140px;height:140px;margin:0 auto 24px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.03));
  border:2px dashed rgba(212,175,55,0.4);
  display:flex;align-items:center;justify-content:center;
  animation:pulse-big 2.5s ease-in-out infinite;
}
@keyframes pulse-big{
  0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.3);transform:scale(1)}
  50%{box-shadow:0 0 0 20px rgba(212,175,55,0);transform:scale(1.05)}
}
.icon-big svg{width:64px;height:64px;stroke:var(--gold);fill:none;stroke-width:1.5}

.title{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:12px}
.subtitle{font-size:14px;color:var(--text-dim);line-height:1.8;margin-bottom:28px}
.subtitle b{color:var(--gold);font-weight:700}

.features-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;text-align:start}
.feat-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(19,47,76,0.6);border:1px solid var(--border);border-radius:12px}
.feat-row svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;flex-shrink:0}
.feat-row span{font-size:12.5px;color:var(--text)}

.btn-back{
  width:100%;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#f4d03f 0%,#d4af37 50%,#b8941f 100%);
  color:var(--navy);font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 12px 30px rgba(212,175,55,0.4);
  transition:all .2s;
}
.btn-back:active{transform:scale(0.97)}
.btn-back svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.5}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="page-title">چت</div>
    <button class="icon-btn" style="visibility:hidden"><svg viewBox="0 0 24 24"></svg></button>
  </div>

  <div class="wrap">
    <div class="empty-box">

      <div class="icon-big">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      </div>

      <div class="title">به‌زودی</div>
      <div class="subtitle">
        بخش <b>چت</b> به‌زودی فعال می‌شود — می‌توانید با فروشندگان و خریداران مستقیم صحبت کنید
      </div>

      <div class="features-list">
        <div class="feat-row">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>چت مستقیم با فروشنده</span>
        </div>
        <div class="feat-row">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>
          <span>ارسال عکس و صدا</span>
        </div>
        <div class="feat-row">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>پاسخ سریع</span>
        </div>
      </div>

      <button class="btn-back" onclick="location.href='home.html'">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>برگشت به خانه</span>
      </button>

    </div>
  </div>

</div>

</body>
</html>
